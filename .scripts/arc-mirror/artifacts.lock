# ARC (actions-runner-controller, gha-runner-scale-set mode) artifacts mirrored
# into Harbor. Card #338. Read by .scripts/arc-mirror/mirror.sh. Runbook:
# docs/arc-mirror.md.
#
# This file is the single source of truth for WHAT is mirrored and at WHICH
# digest. #339 (the ARC install) must reference exactly these refs:
#   chart:  oci://<registry>/<project>/<target>  --version <tag>
#   image:  <registry>/<project>/<target>:<tag>@<digest>
#
# The digest is the upstream manifest digest of <source>:<tag>. For images it
# is the multi-arch INDEX digest (linux/arm64 + linux/amd64 + attestations).
# The mirror copies the whole index byte-for-byte, so the digest in Harbor is
# identical to upstream. The copy always pulls <source>@<digest>, never the
# tag, so a re-pushed upstream tag cannot sneak in.
#
# Pinned 2026-10-08: ARC 0.15.0 (released 2026-10-01), runner 2.338.0
