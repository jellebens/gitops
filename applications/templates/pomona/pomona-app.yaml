apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pomona
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # After the platform data services it consumes: mqtt (broker) and
    # influxdb (wave 18). Same landing-zone wave as zeus/jupiter.
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: landing-zones
  destination:
    server: https://kubernetes.default.svc
    namespace: pomona
  sources:
    - repoURL: {{ .Values.repos.config.url | quote }}
      targetRevision: {{ .Values.repos.config.targetRevision | default "HEAD" }}
      path: landingzones/pomona
      helm:
        releaseName: pomona
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/.config/shared/values.yaml
          - $values/.config/{{ .Values.environment | default "lab" }}/values.yaml
          - $values/.config/{{ .Values.environment | default "lab" }}/pomona.yaml
    - repoURL: {{ .Values.repos.config.url | quote }}
      targetRevision: {{ .Values.repos.config.targetRevision | default "HEAD" }}
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
