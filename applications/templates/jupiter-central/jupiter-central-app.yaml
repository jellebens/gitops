apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jupiter-central
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Central jupiter services (price-service). After the platform layer —
    # sealed-secrets/cilium, and mqtt at 16 — and BEFORE the zeus landing zone
    # (30): the central price API must exist before any consumer that might be
    # flipped onto it (card #107).
    argocd.argoproj.io/sync-wave: "20"
    # Diff via a server-side dry-run: the CNPG Cluster jupiter-pg was forever
    # OutOfSync under Argo's local structured-merge diff (schema defaults inside
    # atomic lists), with a no-op self-heal apply every 5 min. Same fix as
    # ceres and kyverno; see AGENTS.md "Known Pitfalls". Verified 2026-10-09:
    # `argocd app diff jupiter-central --core --server-side-generate` is empty.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: landing-zones
  destination:
    server: https://kubernetes.default.svc
    namespace: jupiter-central
  sources:
    - repoURL: {{ .Values.repos.config.url | quote }}
      targetRevision: {{ .Values.repos.config.targetRevision | default "HEAD" }}
      path: landingzones/jupiter-central
      helm:
        releaseName: jupiter-central
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/.config/shared/values.yaml
          - $values/.config/{{ .Values.environment | default "lab" }}/values.yaml
          - $values/.config/{{ .Values.environment | default "lab" }}/jupiter-central.yaml
    - repoURL: {{ .Values.repos.config.url | quote }}
      targetRevision: {{ .Values.repos.config.targetRevision | default "HEAD" }}
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
