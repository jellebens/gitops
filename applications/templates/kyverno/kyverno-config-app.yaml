apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    # Diff via a server-side dry-run instead of Argo's local structured-merge
    # diff. The local diff drops CRD-schema defaults inside atomic lists (the
    # kyverno CRD defaults `skipBackgroundRequests` and
    # `validate.allowExistingViolations` on every rule), so the ClusterPolicies
    # were forever OutOfSync and self-healed every 5 min with a no-op apply.
    # See AGENTS.md "Known Pitfalls".
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform-services
  sources:
    - repoURL: https://github.com/jellebens/gitops.git
      targetRevision: master
      path: platform/kyverno-config
      helm:
        releaseName: kyverno-config
        valueFiles:
          - $values/.config/shared/values.yaml
          - $values/.config/{{ .Values.environment | default "lab" }}/values.yaml
          - $values/.config/{{ .Values.environment | default "lab" }}/kyverno.yaml
    - repoURL: https://github.com/jellebens/gitops.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
