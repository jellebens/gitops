apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    # Diff via a server-side dry-run instead of Argo's local structured-merge
    # diff, which drops schema defaults inside atomic lists: the
    # policies.kyverno.io CRDs were forever OutOfSync with an empty
    # `argocd app diff`. See AGENTS.md "Known Pitfalls".
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform-services
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  sources:
    - repoURL: {{ .Values.repos.kyverno.url | quote }}
      chart: kyverno
      targetRevision: {{ .Values.repos.kyverno.targetRevision | quote }}
      helm:
        releaseName: kyverno
        ignoreMissingValueFiles: true
        values: |
          crds:
            install: true
          # The kyverno-api subchart renders `labels: {}` on its CRDs; the API
          # server prunes the empty map, leaving the app forever OutOfSync.
          # A non-empty label map keeps desired == live.
          kyverno-api:
            labels:
              app.kubernetes.io/part-of: kyverno
          # ServiceMonitors labeled for kube-prometheus-stack (repo
          # convention) — feeds the kyverno Grafana dashboard (#234).
          admissionController:
            replicas: 1
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
          backgroundController:
            replicas: 1
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
          reportsController:
            replicas: 1
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
          cleanupController:
            replicas: 1
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
    - repoURL: {{ .Values.repos.config.url | quote }}
      targetRevision: {{ .Values.repos.config.targetRevision | default "HEAD" }}
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
