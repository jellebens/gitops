apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # ARC (#339) cluster-scoped prerequisites: the Longhorn RWX StorageClass
    # (reclaim Delete, 1 replica) for the kubernetes-mode work volumes. After
    # longhorn (12/13), before the controller (20) and the runner set (30).
    argocd.argoproj.io/sync-wave: "19"
spec:
  project: platform-services
  sources:
    - repoURL: {{ .Values.repos.config.url | quote }}
      targetRevision: {{ .Values.repos.config.targetRevision | default "HEAD" }}
      path: platform/arc-config
      helm:
        releaseName: arc-config
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/.config/shared/values.yaml
          - $values/.config/{{ .Values.environment | default "lab" }}/values.yaml
          - $values/.config/{{ .Values.environment | default "lab" }}/arc-config.yaml
    - repoURL: {{ .Values.repos.config.url | quote }}
      targetRevision: {{ .Values.repos.config.targetRevision | default "HEAD" }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
