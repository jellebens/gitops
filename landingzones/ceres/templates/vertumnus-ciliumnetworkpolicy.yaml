{{- if .Values.networkPolicy.enabled }}
# Scoped, INGRESS-ONLY CiliumNetworkPolicy for every Vertumnus (zeus/pomona
# pattern): default-denies inbound while leaving egress open (the Vertumnus instances
# must reach the EMQX VIP). The only ingress admitted is the Prometheus
# scrape of the metrics port from the observability namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ceres-vertumnus
  namespace: ceres
  labels:
    app.kubernetes.io/name: ceres-vertumnus
    app.kubernetes.io/part-of: ceres
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ceres-vertumnus
  ingress:
    {{- if .Values.metrics.enabled }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.metricsScrapeNamespace | quote }}
      toPorts:
        - ports:
            - port: {{ .Values.metrics.port | quote }}
              protocol: TCP
    {{- end }}
    {{- if .Values.vertumnus.apiPort }}
    # The operator API: from the node itself — kubectl port-forward (the kubelet
    # proxies from the host) — and never from the LAN.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - port: {{ .Values.vertumnus.apiPort | quote }}
              protocol: TCP
    {{- end }}
    {{- if and .Values.vertumnus.apiPort .Values.janus.enabled }}
    # ceres ADR-0015: the operator console forwards a hand dose here, so it is
    # the ONE pod admitted to this port — by label, not by namespace. Nothing
    # about the loop's authority changes: Janus still needs this unit's own
    # VERTUMNUS_TOKEN to write, and every rail (role, fleet ceiling, lockout,
    # pending judgement, the caps) is applied by the Vertumnus exactly as it is
    # to a dose the loop asked for. A separate rule from the `fromEntities` one
    # above on purpose — Cilium 1.16 rejects a rule that carries both.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ceres
            app.kubernetes.io/name: ceres-janus
      toPorts:
        - ports:
            - port: {{ .Values.vertumnus.apiPort | quote }}
              protocol: TCP
    {{- end }}
    {{- if not (or .Values.metrics.enabled .Values.vertumnus.apiPort) }}
    []
    {{- end }}
{{- end }}
