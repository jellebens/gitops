{{- range $id, $u := .Values.units }}
{{- if $u.enabled }}
# ceres-vertumnus-{{ $id }}: the two documents a Vertumnus reads (ceres
# architecture §6). values.yaml is what gitops decides for this Vertumnus;
# config.yaml is the unit's config document (the ADR-0002 facts — from
# migration slice 2 the registry projects it from Postgres onto retained
# MQTT, same shape). ${MQTT_USER}/${MQTT_PASS} are expanded by the Vertumnus from
# the pod env (the unit's sealed secret via envFrom).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceres-vertumnus-{{ $id }}
  namespace: ceres
  labels:
    app.kubernetes.io/name: ceres-vertumnus
    app.kubernetes.io/instance: ceres-vertumnus-{{ $id }}
    app.kubernetes.io/part-of: ceres
    ceres.jellebens.dev/unit: {{ $id | quote }}
data:
  values.yaml: |
    # rendered by gitops landingzones/ceres — do not edit in the cluster
    unit: {{ $id }}
    mode: {{ $.Values.mode }}
    role: {{ $u.role }}
    contract: {{ $u.contract }}
    config_source: {{ $u.configSource | default "file" }}
    interval_seconds: {{ $.Values.vertumnus.intervalSeconds }}
    freshness_seconds: {{ $.Values.vertumnus.freshnessSeconds }}
    confirm_minutes: {{ $.Values.vertumnus.confirmMinutes }}
    metrics_port: {{ $.Values.metrics.port }}
    api_port: {{ $.Values.vertumnus.apiPort }}
    api_token: "${VERTUMNUS_TOKEN}"
    {{- if $.Values.mesh.enabled }}
    # ADR-0017: the token-free mesh listener, on the pod IP only (refused otherwise)
    mesh_api_port: {{ $.Values.mesh.port }}
    mesh_api_host: "${POD_IP}"
    {{- end }}
    mqtt:
      host: {{ $u.mqtt.host }}
      port: {{ $u.mqtt.port }}
      client_id: {{ $u.mqtt.clientId }}
      username: "${MQTT_USER}"
      password: "${MQTT_PASS}"
      base_topic: {{ $u.mqtt.baseTopic }}
      own_prefix: {{ $u.mqtt.ownPrefix }}
      {{- if $u.mqtt.legacyBaseTopic }}
      legacy_base_topic: {{ $u.mqtt.legacyBaseTopic }}
      {{- end }}
    rails:
      {{- toYaml $u.rails | nindent 6 }}
  {{- if ne ($u.configSource | default "file") "mqtt" }}
  config.yaml: |
    # the unit config document — rendered by gitops until the registry (slice 2)
    unit: {{ $id }}
    {{- toYaml $u.config | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
