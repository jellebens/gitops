# Their own ServiceAccounts for the Vertumnus and Janus (ceres ADR-0017). Until now every
# pod in ns ceres ran as `default`. The mesh policy selects Janus by its ServiceAccount
# as well as its label, so a pod must match both to be admitted to a unit's mesh
# listener. Neither service talks to the Kubernetes API: no token is mounted.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ceres-vertumnus
  namespace: ceres
  labels:
    app.kubernetes.io/name: ceres-vertumnus
    app.kubernetes.io/part-of: ceres
automountServiceAccountToken: false
{{- if .Values.janus.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ceres-janus
  namespace: ceres
  labels:
    app.kubernetes.io/name: ceres-janus
    app.kubernetes.io/part-of: ceres
automountServiceAccountToken: false
{{- end }}
