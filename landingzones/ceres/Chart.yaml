# 0.13.0 = ceres #315: annona 0.7.0 — the firmware image goes through the API (POST /firmware/{type}/{version}
#          onto the ceres-firmware share, which is now mounted read-write into Annona: annona.firmware.upload).
# 0.14.0 = ceres ADR-0014 (PR #63, 2026-09-16): the weather forecast is a fleet fact — vertumnus 0.18.0, annona 0.7.0
#          (location), carmenta 0.5.0 (sys/weather from Open-Meteo, heat_ahead / frost_ahead), robigus 0.7.0 (relays
#          Carmenta's per-unit advice). Deploy steps outside the chart: the live EMQX ACL gives `carmenta` publish on
#          ceres/+/sys/weather (platform/mqtt/files/acl.conf is the mirror), then PUT /units/pomona-0001/location.
# 0.14.1 = ceres #315: annona 0.8.0 — the firmware upload endpoint is live (the mount and the gateway route shipped in 0.13.0 / 0.14.0).
# 0.15.0 = ceres #315: annona 0.9.0 serves the firmware images itself (GET /firmware/<type>/<version>) at a pinned
#          Cilium LB address on the LAN (annona.lan, 192.168.50.202, plain http; the policy admits `world` on the
#          API port). The ceres-firmware nginx, its Service and its two gateway routes are REMOVED (firmware-server.yaml
#          -> firmware-claim.yaml keeps only the RWX claim). Why: the GIGA's OTA client speaks HTTP/1.0 and the shared
#          gateway's Envoy answers that with 426 — every OTA of 2.3.1 on 2026-09-17 fetched a 16-byte error page.
#          Deploy note: the live `ceres-firmware-direct` NodePort (a hand test of 2026-09-17) is deleted by hand.
# 0.16.0 = ceres ADR-0015: ceres-janus 0.1.0, the operator console — the decisions and the alerts in a
#          browser at https://janus.lab.local (gateway route + lab-CA cert + the ceres-janus-https
#          listener, the hermes pattern; NOT a `world`-admitted LAN LB — that is Annona's shape and it
#          exists only because the GIGA speaks no DNS or TLS). A hand dose is forwarded to the unit's
#          Vertumnus operator API, so every rail still applies; the `janus` broker user gets
#          `subscribe ceres/#` and publish on ceres/sys/status/janus only. The one real widening:
#          vertumnus-ciliumnetworkpolicy.yaml now admits the ceres-janus POD (by label) to the API
#          port, which was host/remote-node only. Owner pre-deploy: the `janus` EMQX user, then seal
#          MQTT_USER/MQTT_PASS/JANUS_TOKEN plus VERTUMNUS_TOKEN_<UNIT> into ceres-janus-secrets.
# 0.17.0 = ceres #316 (ADR-0016): vertumnus 0.20.0 (+ 0.19.0, the v1 wire gone — it loads the values this chart
#          renders), annona 0.10.0 (migration 0005: water changes, reagent product), robigus 0.9.0 (critical pH /
#          acid hold), carmenta 0.5.1. Every sys/config consumer moves to ceres_shared 0.14.0 in this one release —
#          record a water change or a product only after it is live (older consumers refuse the new keys).
#          Why: a model-sized 4 ml probe took the tower from pH 7.27 to 3.44 at 04:51 on 2026-09-18.
#          No broker change: platform/mqtt is untouched (a changed acl.conf rolls EMQX and drops the retained tree).
# 0.18.0 = ceres janus 0.2.0: a browser signs in with a username and a password instead of pasting
#          JANUS_TOKEN into a prompt per tab (owner 2026-09-18, ceres ADR-0015 addendum). The account is
#          three new keys in ceres-janus-secrets (JANUS_USERNAME, JANUS_PASSWORD_HASH, JANUS_SESSION_KEY),
#          delivered by the existing envFrom — no template changes, only the image tag.
