{{- range $s := list (dict "v" .Values.githubApp "type" "Opaque") (dict "v" .Values.harborPush "type" "kubernetes.io/dockerconfigjson") }}
{{- if $s.v.encryptedData }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $s.v.name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    # Before the AutoscalingRunnerSet (wave 0) that reads the GitHub secret.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    {{- range $k, $v := $s.v.encryptedData }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  template:
    metadata:
      name: {{ $s.v.name }}
      namespace: {{ $.Values.namespace }}
      labels:
        app.kubernetes.io/part-of: arc
    type: {{ $s.type }}
{{- end }}
{{- end }}
