{{- with .Values.dashboard.basicAuth }}
{{- if and $.Values.dashboard.enabled .enabled .sealedSecret.encryptedPasswordHash .sealedSecret.encryptedSigningSecret }}
# Dashboard basic-auth credentials (https://hermes.lab.local). Holds the
# password HASH (plugins.dashboard_auth.basic.hash_password), never the
# plaintext, plus the session-token signing secret. Sealed for this name in
# namespace hermes (controller `sealed-secrets` in ns `argocd`); only the
# encrypted values live in git, set in the environment overlay.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .secretName | quote }}
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: hermes
spec:
  encryptedData:
    {{ .passwordHashKey }}: {{ .sealedSecret.encryptedPasswordHash }}
    {{ .signingSecretKey }}: {{ .sealedSecret.encryptedSigningSecret }}
  template:
    metadata:
      name: {{ .secretName | quote }}
      namespace: hermes
    type: Opaque
{{- end }}
{{- end }}
