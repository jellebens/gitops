{{- if .Values.prometheusRule.enabled }}
# jupiter-tervuren — shipped alert for the capacity_peak HA read (card #185).
#
# WHY THIS EXISTS (card #185 root cause, investigated 2026-07-12):
#   The lar's `capacity_peak` read targets
#   sensor.fluvius_meter_1sag1100121989_peak_power — the digital meter's
#   monthly billed-peak register, served by the Fluvius CLOUD polling
#   integration on HA (vesta). That integration is UI-configured (nothing in
#   the home-assitant repo) and only refreshes ~6x/day (InfluxDB
#   `homeassistant` bucket: all nine fluvius_* entities update together at
#   ~:25 past scattered hours — integration-wide cadence, not entity-specific).
#   Between successful cloud refreshes the entity spends MULTI-HOUR stretches
#   `unavailable`, so every 15-min lar cycle that lands in a gap fails the read
#   (measured baseline: bursts of 4/hr for consecutive hours; ~35 errors over a
#   17h pod life ≈ 2/hr average; worst observed 16/6h ≈ 25/12h). This is
#   INHERENT to the cloud integration — not an HA config bug, not a lar bug.
#
# WHY IT IS SAFE TO ABSORB: the #180 month-peak LOCF guard holds the last-good
#   register value on a failed read (a slow-moving monthly maximum — constant
#   5.928 kW through the whole investigation window), so the charge guard's
#   billed-peak target never collapses and control is unaffected. The residual
#   risk is only LOCF STALENESS: the entity being down so long that a genuinely
#   new monthly peak (or the month rollover) is missed for many hours.
#
# THRESHOLD RATIONALE (deliberately NOT the cerberus-R10-suggested 6/3h): the
#   measured ABSORBED-NORMAL baseline already reaches ~8-12 errors/3h in
#   bursts, so a 6/3h alert would flap on behavior the LOCF guard fully
#   covers. Instead this fires only on SUSTAINED near-total failure:
#   > {{ .Values.prometheusRule.capacityPeakErrors12h }} failed reads in 12h out of ~48 cycle reads (>~83%) means the
#   entity has been effectively hard-down for 10h+ — the Fluvius integration
#   is wedged (not just between refreshes) and the LOCF value is stale-ish.
#   Detection latency of ~half a day is proportionate: the register changes at
#   most a handful of times a month. Worst healthy-baseline observation is
#   ~25/12h, leaving comfortable headroom under the default threshold of 40.
#
# EARLIER-CATCH INVARIANT: this is the shipped alert covering
#   jupiter_lar_ha_read_errors_total{read="capacity_peak"}, so cerberus's raw
#   safety-net rule R10 stops re-filing cards for the absorbed hourly blips.
#   Other read labels (soc|grid|house_load|ac — local zwave/Bluetti entities
#   with no cloud gap pattern) stay on R10's any-error catch: for those, ANY
#   error burst is still news and deserves a fresh card.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jupiter-tervuren
  namespace: jupiter-tervuren
  labels:
    app.kubernetes.io/name: jupiter-cell
    app.kubernetes.io/part-of: jupiter
    # Picked up by the kube-prometheus-stack Prometheus ruleSelector.
    release: {{ .Values.prometheusRule.releaseLabel | quote }}
spec:
  groups:
    - name: jupiter-tervuren-alerts
      rules:
        - alert: JupiterLarCapacityPeakReadsFailing
          # Sustained near-total failure of the capacity_peak HA read: the
          # Fluvius cloud entity has been effectively unavailable for 10h+,
          # so the #180 LOCF guard is now holding a stale-ish billed-peak
          # target. Intermittent bursts (the integration's normal between-
          # refresh gaps) stay BELOW this on purpose — see header.
          expr: |
            max by (site_id) (
              increase(jupiter_lar_ha_read_errors_total{read="capacity_peak"}[12h])
            ) > {{ .Values.prometheusRule.capacityPeakErrors12h }}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: lar capacity_peak HA reads failing hard (LOCF stale-ish)
            description: >-
              Site {{ "{{ $labels.site_id }}" }} — more than
              {{ .Values.prometheusRule.capacityPeakErrors12h }} of the lar's
              ~48 capacity_peak reads failed in the last 12h, i.e. the Fluvius
              cloud entity (sensor.fluvius_meter_1sag1100121989_peak_power on
              vesta) has been effectively unavailable for 10h+, not just
              between its ~6x/day refreshes. Control is still safe (#180 LOCF
              guard holds the last-good monthly peak) but the billed-peak
              target is going stale — a new real peak or the month rollover
              could be missed. Check the Fluvius integration on HA
              (Settings -> Devices & Services; cloud login/token), then the
              lar logs in ns jupiter-tervuren for "capacity-peak read failed".
              Card #185 has the full diagnosis.

    # Mode-write discipline (card #228 part 3, jupiter ADR-0029).
    #
    # WHY THIS EXISTS: on 2026-10-05 16:30-17:00Z the charge guard and the
    #   re-check fought over the working-mode select — about 350 writes in 30
    #   minutes — and on 2026-07-30 the battery cycled 3.2 times in a day.
    #   Neither was visible to alerting. The lar image that carries #228 exports
    #   one counter per select write (by source) and one per write it held back.
    #
    # NEEDS lar >= the #228 image. On an older image none of these series
    #   exist, so every rule below evaluates to empty and stays silent.
    #
    # BASELINE (lar logs 2026-10-04 -> 05): 22 legitimate mode writes in a day,
    #   never closer together than 898 s; 2 non-Optimal plans in 14 days; 22
    #   both-flows slots in 14 days, at most 6 on one day.
    - name: jupiter-tervuren-mode-writes
      rules:
        - alert: JupiterLarModeWriteChurn
          # Normal is at most 2 writes per 15 minutes (one per planning cycle).
          expr: |
            sum by (site_id) (increase(jupiter_lar_mode_writes_total[15m])) > 6
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: lar is switching the battery mode too often
            description: >-
              Site {{ "{{ $labels.site_id }}" }} — more than 6 working-mode
              writes in 15 minutes (normal: at most 2). Two writers are
              probably disagreeing. Break it down with
              sum by (mode, source) (increase(jupiter_lar_mode_writes_total[15m]))
              and read the lar log in ns jupiter-tervuren. jupiter ADR-0029
              has the writer precedence table.

        - alert: JupiterLarModeWriteStorm
          # The 2026-10-05 flap was about 180 writes per 15 minutes.
          expr: |
            sum by (site_id) (increase(jupiter_lar_mode_writes_total[15m])) > 20
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: lar mode-write storm — the churn guard is not containing it
            description: >-
              Site {{ "{{ $labels.site_id }}" }} — more than 20 working-mode
              writes in 15 minutes. The churn guard caps plan/recheck writes at
              control.max_writes_per_window, so this many means an exempt
              source (safety, guard, spike) is flapping. Consider
              control.enabled: false until it is understood.

        - alert: JupiterLarWriteCeilingHit
          # Never expected: 6 plan/recheck writes inside one 15-minute window.
          expr: |
            sum by (site_id) (
              increase(jupiter_lar_mode_writes_suppressed_total{reason="ceiling"}[15m])
            ) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: lar churn guard hit its write ceiling — battery parked idle
            description: >-
              Site {{ "{{ $labels.site_id }}" }} — the lar reached
              control.max_writes_per_window and is holding PASSTHROUGH until
              the window clears. Savings are being lost while it rests; find
              what keeps changing the plan's mode.

        - alert: JupiterLarGuardHoldOnDischarge
          # One tick per spike response is normal; a run is the 10-05 flap
          # coming back (now suppressed instead of written).
          expr: |
            sum by (site_id) (
              increase(jupiter_lar_mode_writes_suppressed_total{reason="guard_not_charging"}[15m])
            ) > 6
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: charge guard keeps tripping while the battery is discharging
            description: >-
              Site {{ "{{ $labels.site_id }}" }} — the charge guard asked for a
              hold more than 6 times in 15 minutes while the lar was
              discharging. The hold is not written (it would raise grid
              import), but the guard should not be tripping here: check the
              plan intent against the commanded mode.

        - alert: JupiterLarDwellSustained
          # One dwell is at most 12 poll ticks (120 s / 10 s). More than two
          # full dwells in 30 minutes means something keeps changing its mind.
          expr: |
            sum by (site_id) (
              increase(jupiter_lar_mode_writes_suppressed_total{reason="dwell"}[30m])
            ) > 24
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: lar churn guard is repeatedly delaying mode changes
            description: >-
              Site {{ "{{ $labels.site_id }}" }} — plan/recheck mode writes were
              held back by control.min_dwell_seconds for more than two full
              dwells in 30 minutes. The plan's mode is unstable.

        - alert: JupiterLarSocUnknown
          # The cold-start hold re-reads SoC every planning cycle (15 min);
          # 20m is two cycles without a reading.
          expr: |
            max by (site_id) (jupiter_lar_soc_unknown) == 1
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: lar has no battery SoC reading — holding PASSTHROUGH
            description: >-
              Site {{ "{{ $labels.site_id }}" }} — the lar has had no SoC
              reading for 20 minutes and is holding the battery idle. Check the
              Bluetti integration on HA (vesta) and
              jupiter_lar_ha_read_ok{read="soc"}.

        - alert: JupiterLarPlanNotOptimal
          # Owner decision 2026-10-05 (ADR-0029): a non-Optimal plan is still
          # acted on — a battery below soc_min is infeasible every cycle and
          # the leftover charge is what recovers it — so it is alerted instead.
          expr: |
            min by (site_id) (jupiter_lar_plan_optimal) == 0
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: lar dispatch plan is not Optimal for two cycles
            description: >-
              Site {{ "{{ $labels.site_id }}" }} — the LP has not returned an
              Optimal plan for 20 minutes; the lar is acting on a leftover
              slot-0 setpoint. Usual cause: a SoC reading below soc_min (real,
              or a 0 % glitch). Check the lar log for "Infeasible" and the SoC
              the planner used.

        - alert: JupiterLarPlanBothFlowsElevated
          # The LP plans a charge+discharge wash on some peak-flagged slots
          # (card #324). The lar nets it before actuation, so a few per day is
          # known and harmless: worst day in the 14-day baseline was 6 slots.
          # This fires only when it becomes much more frequent than that.
          expr: |
            sum by (site_id) (increase(jupiter_lar_plan_simultaneous_flows_total[24h])) > 12
          for: 0m
          labels:
            severity: info
          annotations:
            summary: LP is planning charge+discharge on the same slot unusually often
            description: >-
              Site {{ "{{ $labels.site_id }}" }} — more than 12 planning cycles
              in 24 hours had both flows in slot 0 (baseline: at most 6). The
              lar nets them, so the battery is not affected, but the plan's
              later slots carry phantom throughput. See card #324.

        - alert: JupiterLarPlanCostVolatile
          # 14-day median swing is about EUR 0.02 per cycle; the 2026-07-30
          # churn day swung between EUR 2 and 25. Observe first — retune after
          # the #228 re-judge.
          expr: |
            avg_over_time(jupiter_lar_plan_cost_delta_eur[2h]) > 2
          for: 30m
          labels:
            severity: info
          annotations:
            summary: lar plan objective is swinging between cycles
            description: >-
              Site {{ "{{ $labels.site_id }}" }} — the plan's cost changed by
              more than EUR 2 per cycle on average over 2 hours. On 2026-07-30
              this pattern came with 3.2 battery cycles in a day. Check
              jupiter_lar_mode_writes_total and the forecast inputs.

    # Dead battery-telemetry feed (card #333, from the 10-07 review L6).
    #
    # WHY THIS EXISTS: on 2026-10-05 (84 min) and 2026-10-07 (2 h) the Bluetti
    #   feed went blind and nobody was paged. On 2026-10-31 08:46Z -> 11-01
    #   17:39Z the lar rejected the integration's placeholder reading
    #   (51 % / 2008 W / 607 W) every planning cycle for 33 h while
    #   jupiter_lar_battery_telemetry_stale stayed 0 the whole time: every
    #   self-heal reload re-stamps the entities, so the #211 age check never
    #   trips (10-07 postmortem, gitops docs/incidents/2026-10-07-*). Three
    #   signals cover the three failure shapes:
    #     - the stale gauge        -> integration frozen, timestamps not moving
    #     - placeholder rejects    -> integration reloading onto placeholders
    #                                 (the stale gauge is blind to this one)
    #     - JupiterLarSocUnknown   -> cold start with no last-good SoC (the
    #       (mode-writes group)       11-01 09:10Z pod restart mid-blackout)
    #
    # NOT USED: jupiter_lar_ha_read_ok. Its `ac` read (entities.ac_power =
    #   sensor.office_a_c_power) has failed every cycle since at least 10-17
    #   (~95 errors/day), so the all-reads gauge is 0 about 95 % of the time
    #   and `== 0 for 20m` would be a permanently-firing alert. Fix the entity
    #   (or give the gauge a `read` label) first - separate card.
    #
    # CADENCE: one placeholder reject per 15-min planning cycle while a hold
    #   lasts (4/h). Windows are sized so that a sustained hold keeps the
    #   expression true at every evaluation (a window of N cycles always holds
    #   N-1..N increments, never fewer): no flapping, so no `for` needed.
    #
    # BASELINE (Prometheus 2026-10-17 -> 11-01; retention is 15 days, so the
    #   10-07/10-08/10-14 episodes are gone): EVERY day has one run of 6-10
    #   consecutive rejects at ~15:30-17:45Z with jupiter_lar_soc_pct flat for
    #   the stretch, i.e. the 10-14 15:15-16:45Z "episode" is the daily
    #   pattern. The warning therefore fires once a day by design (the 90-min
    #   10-14 hold had to be caught). From 10-26 a second evening run
    #   (19:30-22:00Z) grew from 9 cycles to 22 on 10-29/10-30 and became the
    #   10-31 blackout. The critical fired on the 2h+ afternoon runs of 10-18
    #   (10 cycles) and 10-23 (9), was silent 10-19..10-22 and 10-24/25, and
    #   would have fired every evening from 10-26 - five days before the
    #   blackout.
    - name: jupiter-tervuren-telemetry-feed
      rules:
        - alert: JupiterLarTelemetryStale
          # The #211 age check: every Bluetti entity's HA last_updated is
          # older than ha.battery_stale_after_seconds. 15m = one planning
          # cycle of margin over the lar's own hold.
          expr: |
            max by (site_id) (jupiter_lar_battery_telemetry_stale) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: battery telemetry feed is stale - lar holding last-good values
            description: >-
              Site {{ "{{ $labels.site_id }}" }} - the Bluetti SoC/grid/AC
              entities on HA (vesta) have not updated for 15 minutes; the lar
              is holding its last-good SoC (jupiter_lar_battery_telemetry_age_seconds
              shows how old). Check the Bluetti integration on vesta
              (Settings -> Devices & Services) and whether the Apex 300 is on
              the LAN; the self-heal reload automation should have kicked in.
            runbook: >-
              landingzones/jupiter-tervuren/README.md (Alerting -> Dead
              battery-telemetry feed); gitops
              docs/incidents/2026-09-12-bluetti-all-zero-freeze-and-reload-only-values.md

        - alert: JupiterLarTelemetryStaleLong
          expr: |
            max by (site_id) (jupiter_lar_battery_telemetry_stale) == 1
          for: 2h
          labels:
            severity: critical
          annotations:
            summary: battery telemetry feed stale for more than 2 hours
            description: >-
              Site {{ "{{ $labels.site_id }}" }} - the battery feed has been
              stale for over 2 hours: the self-heal reload did not recover it.
              The lar is blind to SoC; consider control.enabled: false until
              the Apex 300 is back on the network.
            runbook: >-
              landingzones/jupiter-tervuren/README.md (Alerting -> Dead
              battery-telemetry feed); gitops
              docs/incidents/2026-10-07-bluetti-wifi-drop-and-ac-power-cut.md

        - alert: JupiterLarPlaceholderHold
          # Three consecutive planning cycles rejected the placeholder for the
          # SoC consumer: 30 min of hold. A 1h window of a sustained hold
          # always holds 3 or 4 increments, so this is stable while it lasts.
          expr: |
            sum by (site_id) (
              increase(jupiter_lar_battery_placeholder_rejected_total{consumer="soc"}[1h])
            ) >= 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: lar is rejecting the Bluetti placeholder every cycle - SoC on hold
            description: >-
              Site {{ "{{ $labels.site_id }}" }} - the lar has rejected the
              Bluetti integration's placeholder reading (51 % / 2008 W /
              607 W) for three consecutive planning cycles. The integration is
              reloading onto placeholders instead of real pushes, the stale
              gauge cannot see it (each reload re-stamps the entities), and
              the lar is holding its last-good SoC. A ~90-min run at
              15:30-17:45Z happens daily (README); anything else means the
              Apex 300 is off the LAN. Check the Bluetti integration on vesta.
            runbook: >-
              landingzones/jupiter-tervuren/README.md (Alerting -> Dead
              battery-telemetry feed); gitops
              docs/incidents/2026-10-07-bluetti-wifi-drop-and-ac-power-cut.md

        - alert: JupiterLarPlaceholderHoldLong
          # Nine consecutive rejected cycles = the 9th reject lands 2 h after
          # the first. A 2h30m window of a sustained hold holds 9 or 10, so it
          # stays true. Silent on 10-19..10-22 and 10-24/25; fires on the 2h+
          # afternoon runs of 10-18 and 10-23, the 10-26 -> 10-30 evening
          # runs and the blackout.
          expr: |
            sum by (site_id) (
              increase(jupiter_lar_battery_placeholder_rejected_total{consumer="soc"}[2h30m])
            ) >= 9
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: battery telemetry on placeholder hold for more than 2 hours
            description: >-
              Site {{ "{{ $labels.site_id }}" }} - every planning cycle for
              more than 2 hours rejected the Bluetti placeholder: the lar has
              had no real SoC for that long and is still acting on its
              last-good value. This is the 10-31 blackout shape (33 h). Get
              the Apex 300 back on the LAN (vesta Bluetti integration; the
              module's WiFi) and consider control.enabled: false meanwhile.
            runbook: >-
              landingzones/jupiter-tervuren/README.md (Alerting -> Dead
              battery-telemetry feed); gitops
              docs/incidents/2026-10-07-bluetti-wifi-drop-and-ac-power-cut.md
{{- end }}
