{{- if .Values.legate.enabled }}
{{- /*
  Legate does not start with a product on GitHub and no database or no app key,
  and without the admin token's digest and the sign-in it answers nobody. So
  the chart refuses to render it half-given: Argo then keeps what runs.
*/ -}}
{{- if not .Values.postgres.enabled }}
{{- fail "legion: legate.enabled needs postgres.enabled (legate reads GitHub and signs people in through its database)" }}
{{- end }}
{{- range $key, $secret := .Values.legate.secrets }}
{{- if not $secret.encryptedData }}
{{- fail (printf "legion: legate.secrets.%s.encryptedData is empty; seal it first (landingzones/legion/README.md, Secrets)" $key) }}
{{- end }}
{{- end }}
# legion-legate: the API the praetor's view reads from (legion HLD-LEG-003 to
# HLD-LEG-006), at the version in values.yaml. Every call passes its gate: the
# operator's admin token, or the cookie of a person signed in through Legion's
# GitHub App. It reads each enlisted product's main branch on GitHub as the
# app, and keeps the registry, sign-ins and what it last read in PostgreSQL
# (postgres-cluster.yaml).
#
# What is mounted, each read-only and as a folder:
#   /etc/legate                 the configuration (no credential in it)
#   /etc/legate/admin-token     the admin token's digest
#   /etc/legate/github-app      client-id, client-secret: the sign-in
#   /etc/legate/github-app-key  app-id, private-key: reading GitHub
#   /etc/legate/database        host, port, dbname, username, password
#   /etc/legate/database-ca     ca.crt of the database's certificate
#   /etc/ssl/certs              the public authorities, INTERIM (caBundle)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: legion-legate
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-legate
    app.kubernetes.io/part-of: legion
data:
  # No product is named here: from Legion 0.3.0 a product is enlisted, and
  # legate does not start with `products` in this file. `images` are
  # Legion's own fabrica images, which every instance writes to the list of
  # admitted images at its start.
  legate.yaml: |
    {{- if .Values.legate.images }}
    images:
      {{- toYaml .Values.legate.images | nindent 6 }}
    {{- else }}
    {}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legion-legate
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-legate
    app.kubernetes.io/part-of: legion
spec:
  replicas: {{ .Values.legate.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: legion-legate
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legion-legate
        app.kubernetes.io/part-of: legion
      annotations:
        # The configuration is read at the start only; the secrets are read
        # as they are needed and want no restart.
        checksum/config: {{ .Values.legate.images | toYaml | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.legate.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.legate.runAsUser }}
        runAsGroup: {{ .Values.legate.runAsGroup }}
        # The secrets' files are readable by the group, and by nobody else.
        fsGroup: {{ .Values.legate.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  {{- with .Values.avoidNodes }}
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      {{- toYaml . | nindent 22 }}
                  {{- end }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: legion-legate
      {{- if .Values.legate.caBundle.enabled }}
      # INTERIM: legate's image is empty but for the binary, and so holds no
      # certificate authorities; legate 0.2.0 then cannot check GitHub's
      # certificate, and neither reads a repository nor ends a sign-in. This
      # copies the public authorities of a stock image into a volume that
      # legate finds where Go looks for them. It goes when legate's image
      # brings them itself (values.yaml, legate.caBundle).
      initContainers:
        - name: ca-bundle
          image: {{ .Values.legate.caBundle.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["cp", "/etc/ssl/certs/ca-certificates.crt", "/ca/ca-certificates.crt"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: ca-bundle
              mountPath: /ca
      {{- end }}
      containers:
        - name: legate
          image: "{{ .Values.legate.image.repository }}:{{ .Values.legate.image.tag }}"
          imagePullPolicy: {{ .Values.legate.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              value: {{ .Values.legate.port | quote }}
            - name: PROBE_PORT
              value: {{ .Values.legate.probePort | quote }}
            - name: ADMIN_DIGEST_FILE
              value: /etc/legate/admin-token/digest
            - name: DATABASE_DIR
              value: /etc/legate/database
            - name: DATABASE_CA_FILE
              value: /etc/legate/database-ca/ca.crt
            - name: OWN_ADDRESS
              value: {{ .Values.legate.ownAddress | quote }}
            - name: SIGN_IN_CALLBACK
              value: "{{ .Values.legate.ownAddress }}/api/sign-in/callback"
            - name: GITHUB_APP_DIR
              value: /etc/legate/github-app
            - name: GITHUB_APP_KEY_DIR
              value: /etc/legate/github-app-key
            - name: KEEPER
              value: {{ .Values.legate.keeper | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.legate.port }}
              protocol: TCP
            - name: probes
              containerPort: {{ .Values.legate.probePort }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/legate
              readOnly: true
            - name: admin-token
              mountPath: /etc/legate/admin-token
              readOnly: true
            - name: github-app
              mountPath: /etc/legate/github-app
              readOnly: true
            - name: github-app-key
              mountPath: /etc/legate/github-app-key
              readOnly: true
            - name: database
              mountPath: /etc/legate/database
              readOnly: true
            - name: database-ca
              mountPath: /etc/legate/database-ca
              readOnly: true
            {{- if .Values.legate.caBundle.enabled }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs
              readOnly: true
            {{- end }}
          # Ready once it has asked for every product, whatever came of it,
          # and its database answers with the schema up to date; not ready
          # from the moment it is told to stop, while it answers for 5 s more.
          # The first instance to start makes the schema, so the start may
          # take longer than a snapshot's did.
          livenessProbe:
            httpGet:
              path: /livez
              port: probes
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 1
          startupProbe:
            httpGet:
              path: /livez
              port: probes
            periodSeconds: 1
            failureThreshold: 60
          resources:
            {{- toYaml .Values.legate.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: legion-legate
        - name: admin-token
          secret:
            secretName: {{ .Values.legate.secrets.adminToken.name }}
            defaultMode: 0440
        - name: github-app
          secret:
            secretName: {{ .Values.legate.secrets.githubApp.name }}
            defaultMode: 0440
        - name: github-app-key
          secret:
            secretName: {{ .Values.legate.secrets.githubAppKey.name }}
            defaultMode: 0440
        # The secret CloudNativePG writes for the application's role. Only the
        # keys legate reads; the secret also holds whole connection strings.
        - name: database
          secret:
            secretName: {{ .Values.postgres.name }}-app
            defaultMode: 0440
            items:
              - { key: host, path: host }
              - { key: port, path: port }
              - { key: dbname, path: dbname }
              - { key: username, path: username }
              - { key: password, path: password }
        # The authority only: the same secret holds its key, which is not
        # mounted.
        - name: database-ca
          secret:
            secretName: {{ .Values.postgres.name }}-ca
            defaultMode: 0440
            items:
              - { key: ca.crt, path: ca.crt }
        {{- if .Values.legate.caBundle.enabled }}
        - name: ca-bundle
          emptyDir:
            sizeLimit: 2Mi
        {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: legion-legate
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-legate
    app.kubernetes.io/part-of: legion
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: legion-legate
---
# The API only. The probe port is deliberately not here.
apiVersion: v1
kind: Service
metadata:
  name: legion-legate
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-legate
    app.kubernetes.io/part-of: legion
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: legion-legate
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.networkPolicy.enabled }}
---
# Ingress only, the hermes pattern: the gateway (reserved `ingress` identity)
# to the API's port, and nothing else. Egress stays open: legate calls
# github.com and api.github.com over TLS, and its database.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: legion-legate
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-legate
    app.kubernetes.io/part-of: legion
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: legion-legate
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: {{ .Values.legate.port | quote }}
              protocol: TCP
{{- end }}
{{- end }}
