{{- if .Values.legate.enabled }}
# legion-legate: the API the praetor's view reads from (legion HLD-LEG-003,
# TSK-14). It reads Legion's backlog and documents and answers the seven read
# calls under /api. It holds no state and no credential, and has no call that
# writes.
#
# INTERIM, see values.yaml: no sign-in, and a snapshot of Legion's docs/ in the
# image instead of the main branch on GitHub. Each instance reads the same
# files from its own image, so the two agree.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: legion-legate
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-legate
    app.kubernetes.io/part-of: legion
data:
  legate.yaml: |
    products:
      - name: legion
        directory: /products/legion
        commit: {{ .Values.legate.snapshot.commit }}
    caller:
      products: [legion]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legion-legate
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-legate
    app.kubernetes.io/part-of: legion
spec:
  replicas: {{ .Values.legate.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: legion-legate
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legion-legate
        app.kubernetes.io/part-of: legion
      annotations:
        checksum/config: {{ .Values.legate.snapshot | toYaml | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.legate.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.legate.runAsUser }}
        runAsGroup: {{ .Values.legate.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  {{- with .Values.avoidNodes }}
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      {{- toYaml . | nindent 22 }}
                  {{- end }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: legion-legate
      containers:
        - name: legate
          image: "{{ .Values.legate.image.repository }}:{{ .Values.legate.image.tag }}"
          imagePullPolicy: {{ .Values.legate.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              value: {{ .Values.legate.port | quote }}
            - name: PROBE_PORT
              value: {{ .Values.legate.probePort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.legate.port }}
              protocol: TCP
            - name: probes
              containerPort: {{ .Values.legate.probePort }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/legate
              readOnly: true
          # Ready once it has tried to read every product; not ready from the
          # moment it is told to stop, while it answers for 5 s more.
          livenessProbe:
            httpGet:
              path: /livez
              port: probes
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 1
          startupProbe:
            httpGet:
              path: /livez
              port: probes
            periodSeconds: 1
            failureThreshold: 30
          resources:
            {{- toYaml .Values.legate.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: legion-legate
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: legion-legate
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-legate
    app.kubernetes.io/part-of: legion
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: legion-legate
---
# The API only. The probe port is deliberately not here.
apiVersion: v1
kind: Service
metadata:
  name: legion-legate
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-legate
    app.kubernetes.io/part-of: legion
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: legion-legate
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.networkPolicy.enabled }}
---
# Ingress only, the hermes pattern: the gateway (reserved `ingress` identity)
# to the API's port, and nothing else. Egress stays open; legate makes no
# outbound call while it reads a snapshot.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: legion-legate
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-legate
    app.kubernetes.io/part-of: legion
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: legion-legate
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: {{ .Values.legate.port | quote }}
              protocol: TCP
{{- end }}
{{- end }}
