{{- if and .Values.imagePullSecret.enabled .Values.imagePullSecret.sealedSecret.encryptedData }}
# The pull credential of the pods: robot$legion+pull of Harbor's project
# `legion`, as a dockerconfigjson. Pull only; it cannot push. Sealed for
# namespace legion and this name, so it opens nowhere else.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-interface
    app.kubernetes.io/part-of: legion
spec:
  encryptedData:
    {{- range $k, $v := .Values.imagePullSecret.sealedSecret.encryptedData }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  template:
    metadata:
      name: {{ .Values.imagePullSecret.name }}
      namespace: legion
    type: kubernetes.io/dockerconfigjson
{{- end }}
