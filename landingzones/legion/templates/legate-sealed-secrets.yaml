{{- if .Values.legate.enabled }}
# The three secrets legate is given (values.yaml, legate.secrets), each sealed
# for namespace legion and its own name, so it opens nowhere else. How each is
# made and sealed: README, "Secrets".
{{- range $key, $secret := .Values.legate.secrets }}
{{- if $secret.encryptedData }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $secret.name }}
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-legate
    app.kubernetes.io/part-of: legion
spec:
  encryptedData:
    {{- range $k, $v := $secret.encryptedData }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  template:
    metadata:
      name: {{ $secret.name }}
      namespace: legion
    type: Opaque
{{- end }}
{{- end }}
{{- end }}
