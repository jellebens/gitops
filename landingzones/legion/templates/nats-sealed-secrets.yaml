{{- /*
  The secrets of the middleware and of admitting images (values.yaml,
  legate.middleware.secrets and legate.harbor.secret), each sealed for
  namespace legion and its own name. Made and sealed by
  .scripts/seal-legion-nats.sh (README, "NATS").
*/ -}}
{{- $sealed := list }}
{{- if .Values.nats.enabled }}
{{- range $key, $secret := .Values.legate.middleware.secrets }}
{{- $sealed = append $sealed $secret }}
{{- end }}
{{- end }}
{{- if .Values.legate.harbor.enabled }}
{{- if not .Values.legate.harbor.secret.encryptedData }}
{{- fail "legion: legate.harbor.secret.encryptedData is empty; run .scripts/seal-legion-nats.sh (README, NATS)" }}
{{- end }}
{{- if not .Values.tlsCertificate.enabled }}
{{- fail "legion: legate.harbor.enabled reads the lab CA from the landing zone's certificate; it needs tlsCertificate.enabled" }}
{{- end }}
{{- $sealed = append $sealed .Values.legate.harbor.secret }}
{{- end }}
{{- range $secret := $sealed }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $secret.name }}
  namespace: legion
  labels:
    app.kubernetes.io/name: legion-legate
    app.kubernetes.io/part-of: legion
spec:
  encryptedData:
    {{- range $k, $v := $secret.encryptedData }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  template:
    metadata:
      name: {{ $secret.name }}
      namespace: legion
    type: Opaque
{{- end }}
