# Legion (amarok-consulting/legion): the praetor's view. The interface, legate
# (the API) and legate's PostgreSQL. The receiver and NATS come with Legion's
# later work packages and get their own blocks here.
#
# Rules this chart follows, from Legion's own documents:
#   - ADR-LEG-016: every image comes from Harbor. Legion's own are in the
#     project `legion`; nothing is pulled from another registry.
#   - ADR-LEG-009/DEC-05: published through the Cilium gateway with HTTPRoutes.
#     No Ingress object, and no nginx anywhere.
#   - HLD-LEG-003, block 4 and 5: two or more instances on separate nodes; the
#     file server answers /livez and /readyz on a port of its own (8081) and
#     drains for 5 s on a stop.

interface:
  enabled: true
  # Two or more, on separate nodes (PRD-LEG-002/REQ-16): the page keeps loading
  # when a node fails. The anti-affinity below is REQUIRED, so replicas must
  # not exceed the number of schedulable nodes.
  replicas: 2
  # Keep the pods off the control-plane node (owner decision, 2026-11-23).
  # The count of schedulable nodes for the anti-affinity is then the workers.
  avoidControlPlane: true
  image:
    repository: harbor.lab.local/legion/interface
    # The version of the release of Legion (the tag v<tag> in the legion repo),
    # the same as legate's. The
    # image must be pushed under this tag first: build from the legion repo's
    # root with --platform linux/arm64 --provenance=false and
    # --build-arg VERSION=<tag> (README "Image"). The footer of every page
    # shows that version.
    tag: "0.8.0"
    pullPolicy: IfNotPresent
  # The file server's own ports (interface/README.md in the legion repo).
  port: 8080        # the pages; the only port the Service and the route reach
  probePort: 8081   # /livez and /readyz; never in the Service, never routed
  # The server is not ready at once on SIGTERM and serves for 5 s more (its
  # default drain), then gives calls under way 10 s. The grace period must be
  # longer than the two together.
  terminationGracePeriodSeconds: 30
  # The image runs as this numeric user on an empty base (scratch).
  runAsUser: 65532
  runAsGroup: 65532
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

# Legate: the API the view reads from (legion HLD-LEG-003 to HLD-LEG-006), as
# legion's master stands at v0.8.0. It has the gate (every call carries a
# credential), the sign-in through Legion's GitHub App, a database, the
# registry of enlisted products, and it reads each product repository's main
# branch on GitHub, live. Since 0.4.0 the backlog of a product is kept in the
# database (read in once from its backlog file), the products page has a panel
# per kind of document, and the praetor works in personae; legate changes its
# schema itself at its start, and asks nothing new of a deployment. Whoever
# enlists a product, as an admin of its repository on GitHub, is its praetor;
# before 0.3.0 nobody was one.
#
# What it needs is legion's legate/README.md, "What a deployment has to set".
# Three secrets are the owner's to seal (README here, "Secrets"); the chart
# refuses to render legate without them, so that an unfinished release leaves
# the running view as it is instead of replacing it with one nobody can use.
legate:
  enabled: false
  replicas: 2
  image:
    repository: harbor.lab.local/legion/legate
    # The version the image was built as (build argument VERSION) and its tag
    # are the same text by convention: one version for a release, the same for
    # the interface's image. The commit is tagged v<tag> in the legion repo.
    tag: "0.8.0"
    pullPolicy: IfNotPresent
  # Legion's own fabrica images (legion PRD-LEG-004/REQ-33): each with its
  # path in Harbor, its tag and its DIGEST. Every instance writes them to the
  # list of admitted images at its start, so that a manifest may name them;
  # an upgrade names the new digests here. Set per environment. Products are
  # not named anywhere here: from 0.3.0 a product is enlisted by its praetor
  # (`legion enlist <owner>/<repository>`), and Legion's GitHub App must be
  # installed on its repository (ADR-LEG-014/DEC-03).
  images: []
  #  - name: legion/fabrica-stub
  #    tag: "0.2-1"
  #    digest: sha256:...
  # Legion's own address, as a browser names it in `Origin`. The sign-in's
  # cookie is bound to it. The callback is this address + /api/sign-in/callback,
  # and the app's registration on GitHub must name exactly that.
  ownAddress: https://legion.lab.local
  # How often GitHub is asked what stands, for every product (10s at least).
  keeper: 1m
  # OFF since Legion 0.3.2, whose legate image brings the public certificate
  # authorities itself. Legate 0.2.0 and 0.3.0 had none in their image and
  # could not check GitHub's certificate; this init container copied the
  # authorities of a stock Alpine image to /etc/ssl/certs. Kept as a switch
  # for a rollback to one of those two versions: turn it on with them.
  caBundle:
    enabled: false
    image: harbor.lab.local/dockerhub/library/alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
  port: 8080        # the API, under /api; the only port the Service and the route reach
  probePort: 8081   # /livez and /readyz; never in the Service, never routed
  terminationGracePeriodSeconds: 30
  runAsUser: 65532
  runAsGroup: 65532
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # The three secrets legate is given, each a SealedSecret for namespace legion
  # and the name below, mounted read-only as a folder (never by subPath, so a
  # replaced value reaches the running container). Sealed per environment in
  # .config/<env>/legion.yaml. No value of any of them is in git in the clear.
  secrets:
    # The digest of the admin token: the 64 characters `legion admin-token new`
    # prints. The token itself never reaches the cluster; the operator keeps it.
    adminToken:
      name: legion-admin-token
      encryptedData: {}   # { digest: "Ag..." }
    # The sign-in: the client id and client secret of Legion's GitHub App.
    githubApp:
      name: legion-github-app
      encryptedData: {}   # { client-id: "Ag...", client-secret: "Ag..." }
    # Reading GitHub: the app's id and its private key. The most valuable
    # secret of the installation (ADR-LEG-014/NEG-02): in a secret of its own,
    # mounted into legate and nothing else.
    githubAppKey:
      name: legion-github-app-key
      encryptedData: {}   # { app-id: "Ag...", private-key: "Ag..." }

# Legate's database (legion ADR-LEG-013): PostgreSQL 18, one database `legate`
# owned by the role `legate`, as a CloudNativePG Cluster (the operator is the
# platform service `cnpg`). The operator writes the credential to the Secret
# `<name>-app` and the authority of the server's certificate to `<name>-ca`;
# legate mounts both, and connects with verify-full. Legate makes and changes
# its own schema at its start; nothing here does.
postgres:
  enabled: false
  name: legion-pg
  # Through Harbor's `ghcr` proxy cache (ADR-LEG-016: every image from Harbor).
  # Pin the minor.
  image: harbor.lab.local/ghcr/cloudnative-pg/postgresql:18.3
  instances: 2
  storageClass: longhorn
  size: 2Gi
  podMonitor: false
  # Labels the operator copies onto every object of the Cluster, the PVCs
  # included (the Longhorn backup group, per environment).
  inheritedLabels: {}
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi

# Nodes the pods of this landing zone are kept off, by name
# (kubernetes.io/hostname). For a node that cannot pull from Harbor.
avoidNodes: []

# What the pods pull with: the pull-only robot of the Harbor project `legion`
# (robot$legion+pull, platform/harbor-config). Its dockerconfigjson is sealed
# per environment for namespace legion / secret `name`, key .dockerconfigjson.
# The project is public, so pulls also work without it; with it, the project
# can be made private by one line in platform/harbor-config/values.yaml.
imagePullSecret:
  enabled: false
  name: legion-harbor-pull
  sealedSecret:
    encryptedData: {}   # { .dockerconfigjson: "Ag..." }

service:
  type: ClusterIP
  port: 80

# Scoped, INGRESS-ONLY CiliumNetworkPolicy (docs/network-policies.md, the
# hermes pattern): only the Cilium gateway (reserved `ingress` identity) may
# reach the pages' port. Egress stays open; the interface makes no outbound
# call anyway. Kubelet probes come from the host identity, which Cilium admits
# by default under ingress enforcement. Disable with this one flag.
networkPolicy:
  enabled: true

# Through the SHARED GATEWAY (the hermes / ceres-janus pattern): the route, the
# redirect and the certificate ship together so the view is never half-exposed.
# HTTPS needs its own listener per hostname in .config/<env>/gateway.yaml
# (`legion-https`) and an A record in .config/<env>/coredns-lab.yaml; see the
# README "Enable".
gateway:
  enabled: true
  parentRef:
    name: cilium-gateway
    namespace: gateway
    sectionName: http
  hostnames:
    - legion.lab.local
  httpToHttpsRedirect:
    enabled: false
    sectionName: http

tlsCertificate:
  enabled: false
  secretName: legion-server-tls
  commonName: legion.lab.local
  dnsNames:
    - legion.lab.local
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: lab-ca-issuer
    kind: ClusterIssuer
