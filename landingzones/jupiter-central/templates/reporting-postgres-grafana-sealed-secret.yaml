{{- if and .Values.reporting.postgres.enabled .Values.reporting.postgres.grafanaRole.enabled .Values.reporting.postgres.grafanaRole.sealedSecret.encryptedData }}
# The password of the read-only `grafana` role on jupiter-pg (card #308).
# CloudNativePG reads keys `username` + `password` from this secret to manage
# the role (reporting-postgres-cluster.yaml `managed.roles`). Rendered ONLY once
# .config/<env>/jupiter-central.yaml provides real sealed blobs (namespace +
# name scoped: seal for ns jupiter-central / secret
# {{ .Values.reporting.postgres.grafanaRole.secret }}); until then the operator
# keeps the role absent and the Grafana datasource simply fails to connect —
# nothing else is affected (the reporting-service writes as the app role).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.reporting.postgres.grafanaRole.secret }}
  namespace: jupiter-central
spec:
  encryptedData:
    {{- range $k, $v := .Values.reporting.postgres.grafanaRole.sealedSecret.encryptedData }}
    {{- if $v }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
  template:
    metadata:
      name: {{ .Values.reporting.postgres.grafanaRole.secret }}
      namespace: jupiter-central
    type: kubernetes.io/basic-auth
{{- end }}
