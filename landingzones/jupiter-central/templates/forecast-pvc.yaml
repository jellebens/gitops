{{- if .Values.forecast.persistence.enabled }}
# Shared forecast-artifact volume: the training CronJob WRITES
# <site_id>/<target>.json here (atomic tmp+rename), the serving deployment
# READS it (mounted read-only). longhorn since #238, so the artifacts survive
# losing a node.
#
# RWO: the volume attaches to ONE node at a time and the serving pod holds it
# permanently, so the trainer Job is pinned to that pod's node by podAffinity
# (forecast.trainer.coLocateWithServer, see forecast-cronjob.yaml). local-path
# used to enforce that implicitly through PV node affinity; longhorn does not.
# Do not add a second writer or a second serving replica without moving to a
# real multi-node access mode first.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forecast-artifacts
  namespace: jupiter-central
  labels:
    app.kubernetes.io/name: forecast-service
    app.kubernetes.io/part-of: jupiter
spec:
  accessModes:
    - {{ .Values.forecast.persistence.accessMode }}
  {{- with .Values.forecast.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.forecast.persistence.size }}
{{- end }}
