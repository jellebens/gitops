{{- range $id, $u := .Values.units }}
{{- if and $u.enabled $u.secret.sealedSecret.enabled $u.secret.sealedSecret.encryptedData }}
# Broker credentials for demeter-brain-{{ $id }} (keys MQTT_USER / MQTT_PASS).
# Rendered only once .config/<env>/demeter.yaml provides real sealed blobs;
# until then the Deployment's envFrom (optional: true) keeps the pod up, idle
# and unable to dose. Sealed blobs are NAMESPACE + NAME scoped: seal for
# ns demeter / secret {{ $u.secret.name }} — owner runbook in the README.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $u.secret.name }}
  namespace: demeter
spec:
  encryptedData:
    {{- range $k, $v := $u.secret.sealedSecret.encryptedData }}
    {{- if $v }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
  template:
    metadata:
      name: {{ $u.secret.name }}
      namespace: demeter
    type: Opaque
{{- end }}
{{- end }}
