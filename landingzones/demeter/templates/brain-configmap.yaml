{{- range $id, $u := .Values.units }}
{{- if $u.enabled }}
# demeter-brain-{{ $id }}: the two documents a brain reads (demeter
# architecture §6). values.yaml is what gitops decides for this brain;
# config.yaml is the unit's config document (the ADR-0002 facts — from
# migration slice 2 the registry projects it from Postgres onto retained
# MQTT, same shape). ${MQTT_USER}/${MQTT_PASS} are expanded by the brain from
# the pod env (the unit's sealed secret via envFrom).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demeter-brain-{{ $id }}
  namespace: demeter
  labels:
    app.kubernetes.io/name: demeter-brain
    app.kubernetes.io/instance: demeter-brain-{{ $id }}
    app.kubernetes.io/part-of: demeter
    demeter.jellebens.dev/unit: {{ $id | quote }}
data:
  values.yaml: |
    # rendered by gitops landingzones/demeter — do not edit in the cluster
    unit: {{ $id }}
    mode: {{ $.Values.mode }}
    role: {{ $u.role }}
    contract: {{ $u.contract }}
    config_source: {{ $u.configSource | default "file" }}
    interval_seconds: {{ $.Values.brain.intervalSeconds }}
    freshness_seconds: {{ $.Values.brain.freshnessSeconds }}
    confirm_minutes: {{ $.Values.brain.confirmMinutes }}
    metrics_port: {{ $.Values.metrics.port }}
    mqtt:
      host: {{ $u.mqtt.host }}
      port: {{ $u.mqtt.port }}
      client_id: {{ $u.mqtt.clientId }}
      username: "${MQTT_USER}"
      password: "${MQTT_PASS}"
      base_topic: {{ $u.mqtt.baseTopic }}
      own_prefix: {{ $u.mqtt.ownPrefix }}
      {{- if $u.mqtt.legacyBaseTopic }}
      legacy_base_topic: {{ $u.mqtt.legacyBaseTopic }}
      {{- end }}
    rails:
      {{- toYaml $u.rails | nindent 6 }}
  {{- if ne ($u.configSource | default "file") "mqtt" }}
  config.yaml: |
    # the unit config document — rendered by gitops until the registry (slice 2)
    unit: {{ $id }}
    {{- toYaml $u.config | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
