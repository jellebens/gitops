{{- if and .Values.metrics.enabled .Values.serviceMonitor.enabled }}
# One ServiceMonitor for every brain: the Services share the
# app.kubernetes.io/name label, and every series carries the brain's own
# unit + unit_type labels, so one dashboard with a `unit` variable serves
# the fleet.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demeter-brain
  namespace: demeter
  labels:
    app.kubernetes.io/name: demeter-brain
    app.kubernetes.io/part-of: demeter
    # Picked up by the kube-prometheus-stack Prometheus serviceMonitorSelector.
    release: {{ .Values.serviceMonitor.releaseLabel | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: demeter-brain
  namespaceSelector:
    matchNames:
      - demeter
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
