{{- if .Values.networkPolicy.enabled }}
# Scoped, INGRESS-ONLY CiliumNetworkPolicy for every brain (zeus/pomona
# pattern): default-denies inbound while leaving egress open (the brains
# must reach the EMQX VIP). The only ingress admitted is the Prometheus
# scrape of the metrics port from the observability namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: demeter-brain
  namespace: demeter
  labels:
    app.kubernetes.io/name: demeter-brain
    app.kubernetes.io/part-of: demeter
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: demeter-brain
  ingress:
    {{- if .Values.metrics.enabled }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.metricsScrapeNamespace | quote }}
      toPorts:
        - ports:
            - port: {{ .Values.metrics.port | quote }}
              protocol: TCP
    {{- else }}
    # Metrics disabled: no ingress is permitted (default-deny ingress).
    []
    {{- end }}
{{- end }}
