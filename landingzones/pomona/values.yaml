# Telegraf ingestion bridge: subscribes to the pomona/# MQTT telemetry and
# writes it to InfluxDB. Official multi-arch image (includes linux/arm64 —
# required, the k3s cluster is arm64). Pinned minor; bump deliberately.
image:
  repository: telegraf
  tag: "1.31-alpine"
  pullPolicy: IfNotPresent

replicaCount: 1

# MQTT source (non-secret half). The broker is the platform EMQX cluster —
# always the mqtt.lab.local VIP, never a pod/node IP (platform/mqtt README).
# Credentials (MQTT_USER / MQTT_PASS) come from the pomona-secrets SealedSecret:
# the DEDICATED least-privilege `pomona-ingest` broker user (subscribe-only on
# pomona/#) — NOT the `pomona` device user the firmware publishes with.
mqtt:
  host: mqtt.lab.local
  port: 1883
  clientId: pomona-ingest
  qos: 1

# InfluxDB sink (non-secret half). Same instance/org as zeus/jupiter; dedicated
# `pomona` bucket (owner-created pre-deploy, 365d retention — see README).
# INFLUX_TOKEN comes from the pomona-secrets SealedSecret (a scoped write token
# for the pomona bucket — see README owner steps).
influx:
  url: http://influxdb-influxdb2.influxdb
  org: zeus
  bucket: pomona

# Secret injected as env (MQTT_USER / MQTT_PASS / INFLUX_TOKEN); telegraf.conf
# references them as ${VAR}. Provide the sealed values in .config/<env>/pomona.yaml
# (kubeseal). The Deployment mounts the resulting Secret with envFrom
# (optional, so first sync does not block before the owner seals real creds).
secret:
  name: pomona-secrets
  sealedSecret:
    enabled: true
    encryptedData: {} # { MQTT_USER: "Ag...", MQTT_PASS: "Ag...", INFLUX_TOKEN: "Ag..." }

# Telegraf's prometheus_client output: self-telemetry (inputs.internal) plus a
# mirror of the ingested pomona metrics, scraped by kube-prometheus-stack.
# Enables future PrometheusRules (e.g. ingest-stalled alerts) without touching
# the Influx path.
metrics:
  enabled: true
  port: 9273

serviceMonitor:
  enabled: true
  interval: 30s
  releaseLabel: kube-prometheus-stack

# Scoped CiliumNetworkPolicy, INGRESS-ONLY by design (zeus pattern): default-
# denies inbound to the pod while leaving egress open (MQTT broker + InfluxDB).
# Only the Prometheus scrape of the metrics port is admitted.
networkPolicy:
  enabled: true
  metricsScrapeNamespace: observability

# Grafana dashboard provisioned as a ConfigMap, discovered by the
# kube-prometheus-stack Grafana sidecar (watches all namespaces). The InfluxDB
# DATASOURCE is NOT touched here — it is static-mounted by observability-config
# (sidecar reload 403s; known gotcha).
dashboard:
  enabled: true
  sidecarLabel: grafana_dashboard
  folderAnnotation: grafana_folder
  # Grafana folder (owner decision: lowercase "pomona"). The sidecar's
  # folderAnnotation + provider.foldersFromFilesStructure are already enabled in
  # .config/lab/observability.yaml (#127); unannotated ConfigMaps stay in
  # General, so this is purely additive — no existing dashboard moves.
  folder: pomona

runtime:
  uid: 1000
  gid: 1000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Probes hit the prometheus_client /metrics listener; generous thresholds —
# ingestion is best-effort telemetry, a restart loop helps nobody.
probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

# --- Demeter: the k3s autodosing brain (cards #278/#224) --------------------
# Source: https://github.com/jellebens/demeter (private; jellebens/pomona-demeter
# image, arm64).
# Watches pomona/water/# and corrects chemistry via pomona/dose/test inside
# the playbook rails (pH-Down 1 ml / 0.5 ml fine, 4 ml/24h acid cap; 5 ml
# Nutrient A then B, once/24h; 60 min lockout; confirm >=10 min; stale or
# offline never doses). Replaces the interim hourly Tethys agent regime.
demeter:
  enabled: true
  image:
    repository: jellebens/pomona-demeter
    tag: "0.4.0"
    pullPolicy: IfNotPresent

  # SHADOW by default: full evaluation, decisions published to
  # pomona/demeter/decision + demeter_would_dose metric, but NO dose command
  # is ever sent. Flip to "active" only per environment
  # (.config/<env>/pomona.yaml), only after the shadow soak, and retire the
  # Tethys hourly task in the same release — two brains must never dose one
  # tank.
  mode: shadow

  # Broker creds: the DEDICATED pomona-demeter EMQX user (subscribe pomona/#,
  # publish ONLY pomona/dose/test + pomona/demeter/#). Seal MQTT_USER /
  # MQTT_PASS in .config/<env>/pomona.yaml (ns pomona, name
  # pomona-demeter-secrets) — owner runbook in the README.
  secret:
    name: pomona-demeter-secrets
    sealedSecret:
      enabled: true
      encryptedData: {} # { MQTT_USER: "Ag...", MQTT_PASS: "Ag..." }

  metrics:
    enabled: true
    port: 9000

  serviceMonitor:
    enabled: true
    interval: 30s
    releaseLabel: kube-prometheus-stack

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

  # /metrics answers from prometheus_client's own thread; liveness is
  # deliberately tolerant — a restarted controller sits out a fresh boot
  # lockout, so restarts cost dosing time and buy nothing.
  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6

  # Rendered verbatim into /config/config.yaml after mode + metrics_port.
  # Mirrors config.example.yaml in the demeter repo — see there for per-key
  # documentation. Since controller 0.3.0 (ADR-0002) this describes THE
  # TOWER, not the controller: bands, tolerances, dose quanta and the lockout
  # are derived by demeter from the plants' targets + the reservoir volume
  # (defaults derive the Tethys playbook exactly). Owner inputs still null:
  # the three reagent container sizes + fill dates (per-env override in
  # .config/<env>/pomona.yaml) and the canopy lux floor for the light check.
  config:
    interval_seconds: 60
    freshness_seconds: 120
    confirm_minutes: 10
    mqtt:
      host: mqtt.lab.local
      port: 1883
      client_id: pomona-demeter
      username: "${MQTT_USER}"
      password: "${MQTT_PASS}"
      base_topic: pomona
    # WHAT IS IN THE TOWER + the optimum for that mix (pomona
    # docs/planting-plan.md, as-built 2026-08-31: 18 of 30 pods).
    tower:
      reservoir_l: 10
      plants:
        - { crop: strawberry, variety: alpine, count: 9, tiers: [3, 4] }
        - { crop: paprika,                     count: 4, tiers: [1] }
        - { crop: dulce_italiano,              count: 3, tiers: [2] }
        - { crop: chili,                       count: 2, tiers: [2] }
      # establishment | established. established_from (ISO date) ramps the
      # EC target automatically — the planting plan says 2-3 weeks after the
      # 2026-08-31 transplant (#262); set the date here when it is decided.
      stage: establishment
      established_from: null
      targets:
        ec_ms_cm:
          establishment: [0.8, 1.0]   # freshly transplanted young plants
          established: [1.4, 1.6]     # mixed-tower compromise (peppers ~1.8-2.4, strawberry 1.2-1.6)
        ph: [5.8, 6.2]                # covers every crop's ideal window; set point ~6.0
        light:                        # observed + alerted (light_low), never actuated (#260)
          hours_per_day: { establishment: 12, established: 14 }
          canopy_lux_min: null        # BH1750 reads ~1/60 of true canopy lux; null = check off
        water_temp_max_c: 26.5
    # THE CONTAINERS: container_ml - pumped since filled_on = remaining;
    # reagent_low_<name> alert < 10 %, an uncoverable dose is BLOCKED. A new
    # filled_on = a refill (counter resets). line_volume_ml = tube volume the
    # fill pushes out before reagent reaches the tank (1 m of 4 mm ID = 12.6 ml).
    reagents:
      ph_down:    { container_ml: null, filled_on: null, line_volume_ml: 0 }
      nutrient_a: { container_ml: null, filled_on: null, line_volume_ml: 0 }
      nutrient_b: { container_ml: null, filled_on: null, line_volume_ml: 0 }
    # THE FEW HARD RAILS (ADR-0001 §4). null = derived from reservoir_l:
    # acid cap 0.4 ml/L per 24 h (4 ml), max single dose 0.2 ml/L (2 ml).
    rails:
      ph_daily_cap_ml: null
      ph_max_single_dose_ml: null
      adaptive: true                # false = fixed playbook, nothing learned
    # CALIBRATION FACTS: DFR0523 2026-09-09 recalibration on the FINAL
    # plumbing (pomona docs/dosing/dfr0523.md). Per-channel AND per-speed —
    # never interpolate; recalibrate after any tube change, then update HERE.
    pumps:
      ph_down:    { channel: 1, full_ml_s: 0.48, slow_ml_s: 0.11, slow_speed: 50 }
      nutrient_a: { channel: 2, full_ml_s: 0.66, slow_ml_s: 0.24, slow_speed: 50 }
      nutrient_b: { channel: 3, full_ml_s: 0.60, slow_ml_s: 0.11, slow_speed: 50 }
