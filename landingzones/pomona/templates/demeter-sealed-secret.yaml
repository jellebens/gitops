{{- if and .Values.demeter.enabled .Values.demeter.secret.sealedSecret.enabled .Values.demeter.secret.sealedSecret.encryptedData }}
# Broker credentials for demeter (keys MQTT_USER / MQTT_PASS): the DEDICATED
# least-privilege pomona-demeter EMQX user — subscribe pomona/#, publish ONLY
# pomona/dose/test + pomona/demeter/#. Never the pomona device user, never
# pomona-ingest. Rendered only once .config/<env>/pomona.yaml provides real
# sealed blobs; until then the Deployment's envFrom (optional: true) keeps
# the pod up, idle and unable to dose.
#
# Sealed blobs are NAMESPACE + NAME scoped: seal for ns pomona / secret
# pomona-demeter-secrets — owner runbook in the landing-zone README.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.demeter.secret.name }}
  namespace: pomona
spec:
  encryptedData:
    {{- range $k, $v := .Values.demeter.secret.sealedSecret.encryptedData }}
    {{- if $v }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
  template:
    metadata:
      name: {{ .Values.demeter.secret.name }}
      namespace: pomona
    type: Opaque
{{- end }}
