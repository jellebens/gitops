{{- if .Values.demeter.enabled }}
# Demeter — the pomona autodosing controller (cards #278/#224). Config is
# rendered verbatim (zeus pattern): mode + metrics port pinned here, the
# playbook (bands, dose quanta, caps, calibration) under .Values.demeter.config
# so an environment override is a values edit, never an image rebuild.
# ${MQTT_USER}/${MQTT_PASS} are expanded by demeter from the pod env
# (pomona-demeter-secrets via envFrom).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pomona-demeter
  namespace: pomona
  labels:
    app.kubernetes.io/name: pomona-demeter
    app.kubernetes.io/part-of: pomona
data:
  config.yaml: |
    # mode governs actuation: shadow = decide + publish + metrics, NEVER dose;
    # active = dose for real. Flipping to active is an owner decision that
    # must retire the Tethys hourly task in the same breath (two brains, one
    # tank — never).
    mode: {{ .Values.demeter.mode }}
    metrics_port: {{ .Values.demeter.metrics.port }}
    {{- toYaml .Values.demeter.config | nindent 4 }}
{{- end }}
