{{- if and .Values.secret.sealedSecret.enabled .Values.secret.sealedSecret.encryptedData }}
# MQTT + InfluxDB credentials for the ingestion bridge (keys MQTT_USER /
# MQTT_PASS / INFLUX_TOKEN). Rendered ONLY once .config/<env>/pomona.yaml
# provides real sealed blobs; until then this is skipped and the Deployment's
# envFrom (optional: true) keeps the pod up (ingestion is a best-effort no-op).
#
# Sealed blobs are NAMESPACE + NAME scoped: seal for ns pomona / secret
# pomona-secrets — owner runbook in the landing-zone README.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: pomona
spec:
  encryptedData:
    {{- range $k, $v := .Values.secret.sealedSecret.encryptedData }}
    {{- if $v }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
  template:
    metadata:
      name: {{ .Values.secret.name }}
      namespace: pomona
    type: Opaque
{{- end }}
