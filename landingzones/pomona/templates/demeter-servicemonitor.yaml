{{- if and .Values.demeter.enabled .Values.demeter.metrics.enabled .Values.demeter.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pomona-demeter
  namespace: pomona
  labels:
    app.kubernetes.io/name: pomona-demeter
    app.kubernetes.io/part-of: pomona
    # Picked up by the kube-prometheus-stack Prometheus serviceMonitorSelector.
    release: {{ .Values.demeter.serviceMonitor.releaseLabel | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pomona-demeter
  namespaceSelector:
    matchNames:
      - pomona
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.demeter.serviceMonitor.interval }}
{{- end }}
