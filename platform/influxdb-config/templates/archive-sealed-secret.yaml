{{- if and .Values.archive.enabled .Values.archive.mqtt.secret.sealedSecret.encryptedData }}
# Broker credentials for the MQTT document archiver (EMQX user
# `telemetry-archive`, subscribe-only on the project trees). Keys: MQTT_USER,
# MQTT_PASS — sealed per env in .config/<env>/influxdb-config.yaml.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.archive.mqtt.secret.name }}
  namespace: {{ .Values.secret.namespace }}
spec:
  encryptedData:
    {{- range $k, $v := .Values.archive.mqtt.secret.sealedSecret.encryptedData }}
    {{- if $v }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
  template:
    metadata:
      name: {{ .Values.archive.mqtt.secret.name }}
      namespace: {{ .Values.secret.namespace }}
    type: Opaque
{{- end }}
