# Admin credentials for InfluxDB, consumed by the influxdb2 chart's
# adminUser.existingSecret. Keys: admin-password, admin-token.
# The actual sealed values are provided per-environment in
# .config/<env>/influxdb-config.yaml.
secret:
  name: influxdb-auth
  namespace: influxdb
  sealedSecret:
    encryptedData: {}

# TLS cert (lab CA) for exposing InfluxDB on the shared gateway so Home Assistant
# (outside the cluster) can write to it. Secret consumed by the gateway listener.
tlsCertificate:
  enabled: true
  secretName: influxdb-server-tls
  commonName: influxdb.lab.local
  dnsNames:
    - influxdb.lab.local
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: lab-ca-issuer
    kind: ClusterIssuer

# --- Buckets: declared here, reconciled by a CronJob (card #290, ADR-0002) ----
# Every bucket the cluster writes telemetry into, with its retention. The
# `influxdb-buckets` CronJob creates a missing bucket and (re)applies the
# declared retention to an existing one, so retention is GitOps-enforced and
# drift (a bucket hand-created with a finite retention, as pomona was on
# 2026-08-31 with 8760h) is corrected within the hour. Retention "0" = infinite.
# The job never deletes a bucket and never touches one that is not listed.
#
# OWNER DECISION 2026-09-11 (ADR-0002): ALL telemetry is stored FOREVER. Every
# bucket below is "0". Do not add a finite retention without superseding the ADR.
#
# Tokens are NOT reconciled here (they cannot be declared in git); a new
# bucket still needs its scoped token minted by the owner if a writer outside
# this namespace is to use it.
buckets:
  enabled: true
  schedule: "20 * * * *" # hourly at :20; run at once with `kubectl -n influxdb create job --from=cronjob/influxdb-buckets buckets-now`
  image: influxdb:2.7
  org: zeus
  list:
    # zeus battery archive (frozen since #169) + jupiter reporting/forecast
    # writers (site-tagged, ADR-0019). Infinite since creation.
    - name: zeus
      retention: "0"
    # Home Assistant's own InfluxDB integration (unfiltered, off-cluster via
    # the gateway). Infinite since creation.
    - name: homeassistant
      retention: "0"
    # The tower's v1 history up to 2026-09-15 (its writer, landingzones/pomona,
    # is gone — ceres #295 step 5). Live value on 2026-10-05: 8760h, i.e. the
    # oldest points would start ageing out on 2027-08-31. THE ONE BUCKET THIS
    # JOB ACTUALLY CHANGES on its first run: 8760h -> infinite.
    - name: pomona
      retention: "0"
    # The Ceres archive (landingzones/ceres telegraf, unit_* / ceres_sys).
    # Created by the Ceres onboarding with retention forever; live value on
    # 2026-10-05: 0. Declared here so that stays enforced — a no-op today.
    - name: ceres
      retention: "0"
    # Prometheus remote_write archive (telemetry-archive below): the app
    # series from the project namespaces, forever. Prometheus itself keeps 15 d.
    # Does not exist yet — created by the job's first run.
    - name: prometheus
      retention: "0"
    # Raw MQTT document archive (telemetry-archive below): jupiter plan /
    # heartbeat / event docs and the zeus tree, verbatim JSON strings. Created
    # by the first run; stays empty until the MQTT half is enabled.
    - name: mqtt
      retention: "0"

# --- telemetry-archive: the long-term archiving service (card #290, ADR-0002)
# One Telegraf deployment next to the database that turns SHORT-lived
# telemetry into InfluxDB points:
#   * remote_write receiver — kube-prometheus-stack ships the project
#     namespaces' series here (.config/<env>/observability.yaml
#     prometheusSpec.remoteWrite); Telegraf writes them to the `prometheus`
#     bucket. Measurement `prometheus`, one FIELD per metric name, every label a
#     tag. This is what preserves the 15 d Prometheus-only series (ceres_*,
#     jupiter_lar_*, jupiter_price_*, jupiter_forecast_*, telegraf internals
#     ...) that model training needs.
#   * MQTT document archiver (optional until the broker user is sealed) —
#     subscribes to whole project trees and stores every message VERBATIM as a
#     string field, so retained JSON documents that a controller overwrites
#     every cycle (jupiter plan/heartbeat, zeus schedule) get a history.
#     ceres/# is NOT in the list: landingzones/ceres ships its own archive.
# It authenticates to InfluxDB with the admin token from `influxdb-auth`, the
# same precedent as the backup CronJobs (co-located platform service; a scoped
# token cannot be minted from git). Revisit trigger in the ADR.
archive:
  enabled: true
  image:
    repository: telegraf
    tag: "1.31-alpine" # the tag ceres-telegraf runs (multi-arch, arm64 proven)
    pullPolicy: IfNotPresent
  replicaCount: 1
  influx:
    url: http://influxdb-influxdb2.influxdb
    org: zeus
  remoteWrite:
    enabled: true
    port: 8080
    path: /receive
    bucket: prometheus
  mqtt:
    # OFF by default, and off in every env until the owner has created the
    # subscribe-only EMQX user `telemetry-archive` and sealed its credentials
    # (README owner runbook). While this is false nothing references the
    # `secret` below, so the render does not need it to exist.
    enabled: false
    host: mqtt.lab.local
    port: 1883
    clientId: telemetry-archive
    qos: 1
    bucket: mqtt
    topics:
      - "jupiter/#"
      - "zeus/#"
    secret:
      name: telemetry-archive-mqtt
      sealedSecret:
        encryptedData: {}
  metrics:
    enabled: true
    port: 9273
  serviceMonitor:
    enabled: true
    interval: 30s
    releaseLabel: kube-prometheus-stack
  networkPolicy:
    # Ingress-only, selects the telemetry-archive pod alone. Disable in one
    # commit by flipping this flag (docs/network-policies.md §3).
    enabled: true
    # remote_write + the metrics scrape both originate here (Prometheus pods).
    sourceNamespace: observability
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Nightly `influx backup` to the NAS (smb StorageClass) — durable archive +
# disaster recovery + the migration vehicle to Proxmox/Ceph (see ADR-0009).
backup:
  enabled: true
  schedule: "30 3 * * *" # 03:30 daily (full backup)
  retentionDays: 14
  storageClass: smb
  size: 10Gi
  image: influxdb:2.7
  org: zeus
  # Incremental: hourly line-protocol/CSV export of the recent window per bucket
  # to the NAS, between the nightly fulls (tighter recovery point). InfluxDB OSS
  # has no native incremental; restore = restore the last full, then replay the
  # increments with `influx write --format csv` (idempotent, overlap-safe).
  incremental:
    enabled: true
    schedule: "5 * * * *" # hourly at :05
    windowMinutes: 75 # > 60 so consecutive runs overlap and never gap
    retentionDays: 3
    buckets:
      - zeus
      - homeassistant
      # pomona hydroponics telemetry (card #222) — the tower's v1 history up to
      # 2026-09-15 (since then the `ceres` bucket, landingzones/ceres). The bucket was
      # owner-created with 365d retention; `buckets.list` above raises it to
      # infinite (#290). Its writer, landingzones/pomona, is gone (ceres #295 step 5).
      # It must exist while this list entry does, or the hourly export logs errors for it.
      - pomona
      # The MQTT document archive (card #290). Small: a few documents per
      # 15-minute cycle. Until the buckets CronJob has created it the export
      # logs "failed/empty" for it and carries on.
      - mqtt
      # NOT listed on purpose (card #290): `prometheus`. The hourly export is
      # annotated CSV of the last 75 min; for ~1 900 series at 30 s that is
      # ~290 000 rows, on the order of 100 MB per file and several GB across
      # the 3-day window on the NAS share. The nightly full covers the bucket,
      # and Prometheus itself still holds the newest 15 days. Add it here once
      # the real export size has been looked at.
      # Also not listed: `ceres` (landingzones/ceres' bucket) — that gap predates
      # this card and is the Ceres workstream's call.
