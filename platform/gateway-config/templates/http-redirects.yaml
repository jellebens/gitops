{{- /*
  HTTP -> HTTPS redirect routes (same pattern as hermes' landing-zone
  hermes-http-to-https). Each entry claims its hostname on the shared plain
  `http` listener and answers a 302 to https; the RequestRedirect filter is
  handled entirely by the gateway Envoy, so no backend (or NetworkPolicy
  admission) is involved. The real content route stays on the service's
  dedicated `<name>-https` SNI listener.
*/ -}}
{{- range .Values.httpRedirects }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-http-to-https
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: platform
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ $.Values.gateway.listenerName }}
  hostnames:
    {{- toYaml .hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 302
{{- end }}
