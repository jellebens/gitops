{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: harbor-postgres
    app.kubernetes.io/part-of: harbor
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.image | quote }}
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
  storage:
    storageClass: {{ .Values.postgres.storageClass }}
    size: {{ .Values.postgres.size }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
  monitoring:
    enablePodMonitor: {{ .Values.postgres.podMonitor }}
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "64MB"
{{- end }}
