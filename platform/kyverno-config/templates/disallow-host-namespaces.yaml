{{- if .Values.policies.disallowHostNamespaces.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Sharing the host PID, IPC, or network namespaces breaks pod
      isolation. Audit-only: legitimate hostNetwork workloads (CSI node
      plugins, CNI) show up in reports and can be exempted per-policy.
spec:
  background: true
  webhookConfiguration:
    failurePolicy: {{ .Values.policies.failurePolicy }}
  rules:
    - name: host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: {{ .Values.policies.failureAction }}
        message: >-
          Sharing the host namespaces is disallowed. hostNetwork,
          hostIPC, and hostPID must be unset or false.
        pattern:
          spec:
            =(hostPID): "false"
            =(hostIPC): "false"
            =(hostNetwork): "false"
{{- end }}
