apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: platform
spec:
  # ONE replica by design: Badger is embedded single-writer storage (directory
  # lock + RWO local-path PVC). Tracing is diagnostic, not on a control path.
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  strategy:
    # Recreate: the RWO PVC can only attach to one pod, and Badger holds a
    # directory lock — a RollingUpdate surge pod would deadlock on both.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
      annotations:
        # Roll the pod when the collector config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image }}
          # Self-healing start (incident 2026-11-02): entrypoint.sh (in the
          # jaeger-config ConfigMap) runs the real binary and, if it exits
          # because the Badger store cannot be opened (torn MANIFEST after an
          # OOM kill / unclean shutdown), wipes /badger/keys + /badger/values so
          # the next restart initialises a fresh store instead of crash-looping.
          # It forwards SIGTERM, so pod stops still close Badger cleanly.
          command: ["/bin/sh", "/etc/jaeger/entrypoint.sh"]
          args: ["--config", "/etc/jaeger/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317, protocol: TCP }
            - { name: otlp-http, containerPort: 4318, protocol: TCP }
            - { name: query, containerPort: 16686, protocol: TCP }
            - { name: metrics, containerPort: 8888, protocol: TCP }
            - { name: health, containerPort: 13133, protocol: TCP }
          readinessProbe:
            httpGet: { path: /status, port: 13133 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /status, port: 13133 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          resources:
{{ toYaml .Values.jaeger.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
            - name: badger
              mountPath: /badger
      volumes:
        - name: config
          configMap:
            name: jaeger-config
            # Read-only mount; 0555 so the wrapper is executable (it is invoked
            # through /bin/sh anyway).
            defaultMode: 0555
            items:
              - key: config.yaml
                path: config.yaml
              - key: entrypoint.sh
                path: entrypoint.sh
        - name: badger
          persistentVolumeClaim:
            claimName: jaeger-badger
