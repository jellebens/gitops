%%--------------------------------------------------------------------
%% mqtt platform broker — git-managed ACL (EMQX `file` authz source).
%%
%% WHY THIS FILE EXISTS (card #156 — DR durability):
%%   The per-user ACLs are created at runtime via the admin REST API and live
%%   ONLY in replicated mnesia (the `built_in_database` authz source). They
%%   survive pod restart / single-node loss, but a full 3-node cluster rebuild
%%   (fresh mnesia) would lose them. This file is the declarative, git-managed
%%   fallback that restores least-privilege authorization on a fresh cluster.
%%
%% HOW IT IS EVALUATED (non-disruptive by construction):
%%   The live authorization chain is, in order:
%%     1. built_in_database   (mnesia — the runtime per-user rules)
%%     2. file  ->  ${EMQX_ETC_DIR}/acl.conf   (THIS FILE)
%%   with authorization.no_match = allow. EMQX walks sources top-to-bottom and
%%   stops at the FIRST source that yields a match. Every live user's mnesia
%%   ruleset ends in an explicit `deny #` catch-all, so on the running cluster
%%   the built_in_database source is ALWAYS terminal for every connected client
%%   and this file is never consulted for them — replacing the default acl.conf
%%   content therefore cannot change any live client's authorization outcome.
%%   On a fresh DR cluster mnesia is empty, built_in_database matches nothing,
%%   and these rules take effect — restoring the same least-privilege grants.
%%
%%   Rules are matched top-to-bottom; first match wins. Keep in sync with the
%%   mnesia rules documented in platform/mqtt/README.md ("Per-client user
%%   management"). When you add/change a runtime ACL via the REST API, mirror
%%   it here so DR stays faithful.
%%
%% NOTE: EMQX treats the `path` file as immutable (read-only). Runtime edits go
%%   to data/authz/acl.conf instead; this file is the boot-time source of truth.
%%--------------------------------------------------------------------

%%==================================================================
%% EMQX system rules (preserved verbatim from the stock acl.conf).
%% Guard the dashboard's $SYS access, allow node-local admin, and block
%% the naked-wildcard firehose subscriptions. Do NOT remove.
%%==================================================================
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.

{allow, {ipaddr, "127.0.0.1"}, all, ["$SYS/#", "#"]}.

{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "+/#"}]}.

%%==================================================================
%% Per-client least-privilege grants (DR mirror of the mnesia rules).
%%==================================================================

%% homeassistant — Home Assistant's MQTT integration. Scoped to its OWN tree
%% only (card #188 — least-privilege hardening). HA consumes zeus data via the
%% homeassistant/# discovery + state topics that zeus-mqtt publishes, so it has
%% no need for the zeus/ tree; the former `all zeus/#` grant was dropped. Publish
%% under zeus/ (including the commander interlock topic) belongs to zeus-mqtt
%% alone (below). NOTE: DR mirror only — the live mnesia rule must be updated via
%% the admin API to match (owner-gated); see README "ACL disaster recovery".
%% Pomona (#277/#278): HA reads the whole pomona/ tree (the GIGA's retained
%% pump/light REQUESTS it relays onto the Fibaro plugs, water chemistry for
%% its own sensors) and publishes exactly ONE pomona topic — pump/power, the
%% plug's measured watts, which Ceres (>= 0.5.1, ADR-0005) takes as proof
%% the pump ran before it judges a dose. Never pump/request (the firmware's
%% decision) nor pump/override (Ceres's).
{allow, {username, "homeassistant"}, all, ["homeassistant/#"]}.
{allow, {username, "homeassistant"}, subscribe, ["ceres/#"]}.  %% #293: Robigus alert documents + registry status
{allow, {username, "homeassistant"}, publish, ["ceres/+/actuator/+/power_w", "ceres/+/actuator/+/set"]}.  %% #295 (ADR-0008): the plug watts + a human override, v2
{allow, {username, "homeassistant"}, subscribe, ["pomona/#"]}.
{allow, {username, "homeassistant"}, publish, ["pomona/pump/power"]}.
{deny,  {username, "homeassistant"}, all, ["#"]}.

%% zeus-mqtt — the zeus battery optimizer.
{allow, {username, "zeus-mqtt"}, all, ["homeassistant/#"]}.
{allow, {username, "zeus-mqtt"}, all, ["zeus/#"]}.
{deny,  {username, "zeus-mqtt"}, all, ["#"]}.

%% cell-tervuren — the live tervuren lar/cell (jupiter). The
%% `subscribe zeus/tervuren/commander` grant is what the single-controller
%% interlock needs to read zeus's commander heartbeat (card #139/#153 fix).
{allow, {username, "cell-tervuren"}, all, ["jupiter/tervuren/#"]}.
{allow, {username, "cell-tervuren"}, subscribe, ["zeus/tervuren/commander"]}.
{deny,  {username, "cell-tervuren"}, all, ["#"]}.

%% reporting — the central fleet-reporting/savings service (jupiter
%% reporting-service, gitops card #161-F). SUBSCRIBE-ONLY across all sites: it
%% consumes every lar's retained plan + heartbeat to re-expose jupiter_reporting_*
%% gauges. It PUBLISHES nothing (pure consumer, never on any actuation path),
%% so only a subscribe grant is given — no publish, no other topic. The `+`
%% single-level wildcard covers all present + future sites without an ACL change.
{allow, {username, "reporting"}, subscribe, ["jupiter/+/plan", "jupiter/+/heartbeat"]}.
{deny,  {username, "reporting"}, all, ["#"]}.

%% pomona-demeter — the pomona autodosing controller (cards #278/#224,
%% landingzones/pomona ceres deployment). Subscribes to the whole pomona
%% tree (water chemistry, unit status, pump state, dose results, its own
%% retained ledger/decision topics) and publishes ONLY the dose command
%% channel, the pump OVERRIDE (ceres 0.4.0, ADR-0003: it runs the
%% circulation pump around a dose to mix; the firmware's level interlock
%% keeps the veto) and its own pomona/demeter/* namespace. Deliberately NO
%% publish anywhere else in pomona/ — never pump/request, light/*,
%% control/* or ota_url. Mirror of the mnesia rules created per the
%% landing-zone README owner runbook (fold into the #252 pomona ACL
%% DR-mirror card).
{allow, {username, "pomona-demeter"}, subscribe, ["pomona/#"]}.
{allow, {username, "pomona-demeter"}, publish, ["pomona/dose/test", "pomona/pump/override", "pomona/demeter/#"]}.
{allow, {username, "pomona-demeter"}, subscribe, ["ceres/pomona-0001/sys/#"]}.  %% #292: the registry's retained sys/config
{deny,  {username, "pomona-demeter"}, all, ["#"]}.

%% unit-pomona-0001 — the tower's node on the v2 contract (pomona firmware 2.0.0,
%% ceres ADR-0008 "Broker users", card #295): an explicit allow-list of what a
%% node publishes (telemetry, its actuators' state/reason, dose acks, its
%% self-description) and subscribes to (requests, desired state, OTA, diag).
%% Never the Vertumnus or Robigus sys/* documents, never another unit.
{allow, {username, "unit-pomona-0001"}, publish, ["ceres/pomona-0001/tele/#", "ceres/pomona-0001/actuator/+/state", "ceres/pomona-0001/actuator/+/reason", "ceres/pomona-0001/dose/result", "ceres/pomona-0001/sys/status", "ceres/pomona-0001/sys/meta", "ceres/pomona-0001/sys/health", "ceres/pomona-0001/sys/ota/result", "ceres/pomona-0001/sys/diag/#"]}.
{allow, {username, "unit-pomona-0001"}, subscribe, ["ceres/pomona-0001/actuator/+/set", "ceres/pomona-0001/dose/request", "ceres/pomona-0001/desired", "ceres/pomona-0001/sys/ota/url", "ceres/pomona-0001/sys/diag/+/get"]}.
{deny,  {username, "unit-pomona-0001"}, all, ["#"]}.

%% vertumnus-pomona-0001 — the tower Vertumnus on the v2 contract (ceres-vertumnus >= 0.10.0,
%% ADR-0008/0010, card #295): its own unit's tree + the fleet ceiling; publishes
%% requests (actuator set, dose/request) and its own sys/* documents and LWT.
%% TRANSITION ONLY (firmware still v1): also the v1 dose channel + pump override
%% and a read of the retained v1 ledger it adopts once — drop these three in the
%% step-5 release together with the republish rules.
{allow, {username, "vertumnus-pomona-0001"}, subscribe, ["ceres/pomona-0001/#", "ceres/sys/mode", "pomona/demeter/ledger"]}.
{allow, {username, "vertumnus-pomona-0001"}, publish, ["ceres/pomona-0001/actuator/+/set", "ceres/pomona-0001/dose/request", "ceres/pomona-0001/sys/role", "ceres/pomona-0001/sys/decision", "ceres/pomona-0001/sys/ledger", "ceres/sys/status/vertumnus-pomona-0001", "pomona/dose/test", "pomona/pump/override"]}.
{deny,  {username, "vertumnus-pomona-0001"}, all, ["#"]}.

%% telegraf-ceres — the long-term archive of every unit's v2 tree (ceres
%% architecture §8 R1, ADR-0006; landingzones/ceres telegraf, card #295).
%% Subscribe-only, publishes nothing.
{allow, {username, "telegraf-ceres"}, subscribe, ["ceres/#"]}.
{deny,  {username, "telegraf-ceres"}, all, ["#"]}.

%% registry — the ceres config service (ceres ADR-0011, card #292): the
%% ONLY publisher of every unit's retained sys/config + desired and of
%% ceres/sys/{units,mode,status/registry}. Reads the whole ceres tree.
{allow, {username, "annona"}, subscribe, ["ceres/#"]}.
{allow, {username, "annona"}, publish, ["ceres/+/sys/config", "ceres/+/desired", "ceres/sys/#"]}.
{deny,  {username, "annona"}, all, ["#"]}.

%% robigus — the plant-health watch (ceres ADR-0009 §6, card #293): reads every
%% unit tree (v1 pomona/# today, v2 ceres/#) and publishes ONLY the alert /
%% advice documents. Never a command topic.
{allow, {username, "robigus"}, subscribe, ["ceres/#", "pomona/#"]}.
{allow, {username, "robigus"}, publish, ["ceres/+/sys/alerts", "ceres/+/sys/advice", "ceres/sys/alerts", "ceres/sys/status/robigus"]}.
{deny,  {username, "robigus"}, all, ["#"]}.

%%==================================================================
%% Default-deny fallback. Replaces the stock `{allow, all}.` — any
%% authenticated client without an explicit grant above (or a matching
%% mnesia rule) is denied. mqtt-admin is a built-in-DB superuser and
%% bypasses authz entirely, so it is unaffected by this rule.
%%==================================================================
{deny, all}.
