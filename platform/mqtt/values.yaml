# Platform MQTT broker — EMQX 3-node HA cluster (jupiter D1, owner signed off
# 2026-07-03). ONE broker for everything: Home Assistant's MQTT integration,
# zeus (transition), jupiter cells/services. Single-replica Mosquitto + PVC is
# the documented fallback if EMQX proves too heavy on the arm64 nodes.
#
# Stable address convention: every client connects to mqtt.lab.local:1883 — a
# Cilium LB-IPAM VIP from the `platform` pool — never a pod/node IP. The
# mqtt.lab.local A record lives in the zone-in-git (.config/<env>/coredns-lab.yaml).
#
# The broker is on telemetry/nudge paths ONLY, never on the battery actuation
# path (zeus/cell actuates Home Assistant directly on the site LAN).
mqtt:
  # Official multi-arch image (arm64 cluster). Pin the exact version.
  image: emqx/emqx:5.8.9
  # 3 nodes spread across k3s nodes: a single node loss keeps the broker up
  # (sessions, retained messages and the auth DB are replicated via mnesia).
  replicas: 3
  # LoadBalancer VIP from the Cilium `platform` LB-IPAM pool (.180-.199).
  # Set per-env in .config/<env>/mqtt.yaml; must match the mqtt.lab.local A record.
  loadBalancerIP: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    # Broker state (mnesia: retained messages, sessions, built-in auth DB)
    # needs POSIX/block semantics -> node-local storage like InfluxDB, NOT the
    # flaky SMB share. One PVC per replica via volumeClaimTemplates.
    storageClassName: local-path
    size: 1Gi

# Auth material — SealedSecret (controller `sealed-secrets`, ns `argocd`).
# Keys:
#   node-cookie        : Erlang cluster cookie shared by the 3 nodes
#   dashboard-password : EMQX dashboard `admin` user password
#   users.csv          : EMQX authn bootstrap file (header: user_id,password,is_superuser)
# Sealed values are set per-env in .config/<env>/mqtt.yaml. Until all keys are
# present the Secret does not exist and the StatefulSet stays Pending (same
# pattern as influxdb-auth).
secret:
  name: mqtt-auth
  sealedSecret:
    encryptedData: {}

# Git-managed ACL (authz) — DR durability for the per-user rules (card #156).
# The per-user ACLs are created at runtime via the admin REST API and live only
# in replicated mnesia (the built_in_database authz source). This ships a
# declarative fallback: platform/mqtt/files/acl.conf is rendered into a
# ConfigMap and subPath-mounted over the stock ${EMQX_ETC_DIR}/acl.conf, which
# is exactly where the live `file` authz source already points. It is
# NON-DISRUPTIVE on the running cluster: built_in_database is first in the authz
# chain and every live user's mnesia ruleset ends in `deny #`, so the file
# source is never consulted for connected clients — it only takes effect on a
# fresh cluster (empty mnesia), i.e. disaster recovery. Keep the rules in sync
# with the mnesia rules documented in README.md.
acl:
  enabled: true

# Scoped, INGRESS-ONLY CiliumNetworkPolicy (repo convention — see zeus):
# egress stays fully open; inbound is limited to MQTT 1883 (LAN + cluster),
# intra-cluster EMQX gossip/RPC, and the dashboard from inside the cluster.
networkPolicy:
  enabled: true

# Prometheus scrape (kube-prometheus-stack, ns observability). EMQX 5.8 serves
# Prometheus text at GET /api/v5/prometheus/stats on the dashboard listener
# (18083); that endpoint is unauthenticated (EMQX default, pinned explicitly in
# the StatefulSet) and reachable only in-cluster — the existing CNP allows
# 18083 from the `cluster` entity (which includes the Prometheus pods) and the
# LB exposes 1883 only. Scraped per pod via the headless service so each of the
# 3 cluster nodes is its own target.
serviceMonitor:
  enabled: true
  # Broker telemetry, not on the kiosk hot path — the global 30s cadence is fine
  # (zeus uses 15s for the near-real-time dashboard; this doesn't need it).
  interval: 30s
  # Prometheus selects ServiceMonitors with this label (serviceMonitorSelector).
  releaseLabel: kube-prometheus-stack

# USE-method alerting rules (kube-prometheus-stack picks these up by label).
prometheusRule:
  enabled: true
  releaseLabel: kube-prometheus-stack

# Grafana dashboard (USE method) provisioned as a ConfigMap, discovered by the
# kube-prometheus-stack Grafana dashboard sidecar (watches all namespaces).
dashboard:
  enabled: true
  # Label the sidecar watches for (kube-prometheus-stack default).
  sidecarLabel: grafana_dashboard

# Rule-engine REPUBLISH BRIDGE (demeter card #295, ADR-0008 "Transition" step 2).
# The tower's firmware still speaks the v1 tree (pomona/<zone>/<metric>,
# pomona/pump/*, pomona/unit/*); every v2 consumer (the demeter brain on
# `contract: v2`, Robigus, the Telegraf archive, Home Assistant 2.0) reads
# demeter/pomona-0001/… (ADR-0008). These rules mirror one tree onto the other,
# both ways, so the four repos can move in any order and the firmware is the
# LAST thing to flip. Declared as config (env vars on the StatefulSet), not via
# the REST API: git is the source of truth and a fresh cluster gets them back.
# Retain and QoS follow the source message (${flags.retain}, ${qos}) unless a
# rule says otherwise; a v1 metric is non-retained, a v1 request is retained,
# exactly as ADR-0008 rule 1 wants. NO loop is possible: no v1->v2 rule reads a
# topic a v2->v1 rule writes (override, ota_url, i2c_scan/get, control/mode).
# Delete this block (rules.enabled: false) in the step-5 release after firmware
# 2.0.0 is on the tower; the old retained pomona/# topics are cleared by hand.
rules:
  enabled: true
  unit: pomona-0001            # the one v1 unit; a second v1 unit is not planned
  list:
    # ---- v1 -> v2: the node's process data and self-description ------------
    - id: pomona_v2_tele
      description: "pomona/<water|air>/<metric> -> demeter/pomona-0001/tele/<zone>/<metric> (non-retained numbers)"
      sql: SELECT *, nth(2, tokens(topic, '/')) as zone, nth(3, tokens(topic, '/')) as metric FROM "pomona/water/+", "pomona/air/+"
      topic: demeter/pomona-0001/tele/${zone}/${metric}
      qos: "${qos}"
      retain: "false"
      payload: "${payload}"
    - id: pomona_v2_node
      description: "pomona/unit/rssi_dbm|uptime_s -> tele/node/<metric>"
      sql: SELECT *, nth(3, tokens(topic, '/')) as metric FROM "pomona/unit/rssi_dbm", "pomona/unit/uptime_s"
      topic: demeter/pomona-0001/tele/node/${metric}
      qos: "${qos}"
      retain: "false"
      payload: "${payload}"
    - id: pomona_v2_status
      description: "pomona/unit/status -> sys/status (the LWT, retained)"
      sql: SELECT * FROM "pomona/unit/status"
      topic: demeter/pomona-0001/sys/status
      qos: "1"
      retain: "true"
      payload: "${payload}"
    - id: pomona_v2_health
      description: "pomona/unit/sensors -> sys/health (availability map, retained)"
      sql: SELECT * FROM "pomona/unit/sensors"
      topic: demeter/pomona-0001/sys/health
      qos: "1"
      retain: "true"
      payload: "${payload}"
    - id: pomona_v2_meta
      description: "pomona/unit/fw_version -> sys/meta (a v1 node's self-description, synthesised)"
      sql: SELECT * FROM "pomona/unit/fw_version"
      topic: demeter/pomona-0001/sys/meta
      qos: "1"
      retain: "true"
      # A JSON payload must be HOCON-quoted (outer quotes, inner escaped) or the
      # env parser reads it as an object and the node refuses to boot (tested
      # locally 2026-09-12 against emqx/emqx:5.8.9).
      payload: '"{\"type\":\"aeroponic_tower\",\"node\":\"giga-r1\",\"fw_version\":\"${payload}\",\"contract\":1,\"via\":\"emqx-bridge\",\"actuators\":[\"pump\",\"light\"]}"'
    - id: pomona_v2_pump_state
      description: "pomona/pump/request -> actuator/pump/state (the node's decision, retained)"
      sql: SELECT * FROM "pomona/pump/request"
      topic: demeter/pomona-0001/actuator/pump/state
      qos: "1"
      retain: "true"
      payload: "${payload}"
    - id: pomona_v2_pump_reason
      description: "pomona/pump/reason -> actuator/pump/reason"
      sql: SELECT * FROM "pomona/pump/reason"
      topic: demeter/pomona-0001/actuator/pump/reason
      qos: "1"
      retain: "true"
      payload: "${payload}"
    - id: pomona_v2_pump_power
      description: "pomona/pump/power (HA, the plug's watts) -> actuator/pump/power_w"
      sql: SELECT * FROM "pomona/pump/power"
      topic: demeter/pomona-0001/actuator/pump/power_w
      qos: "1"
      retain: "true"
      payload: "${payload}"
    - id: pomona_v2_light_state
      description: "pomona/light/request -> actuator/light/state"
      sql: SELECT * FROM "pomona/light/request"
      topic: demeter/pomona-0001/actuator/light/state
      qos: "1"
      retain: "true"
      payload: "${payload}"
    - id: pomona_v2_dose_result
      description: "pomona/dose/result (v1 event line) -> dose/result; a brain on v2 reads a non-JSON result as a v1 line"
      sql: SELECT * FROM "pomona/dose/result"
      topic: demeter/pomona-0001/dose/result
      qos: "1"
      retain: "true"
      payload: "${payload}"
    - id: pomona_v2_diag
      description: "pomona/unit/i2c_scan -> sys/diag/i2c_scan"
      sql: SELECT * FROM "pomona/unit/i2c_scan"
      topic: demeter/pomona-0001/sys/diag/i2c_scan
      qos: "1"
      retain: "true"
      payload: "${payload}"
    - id: pomona_v2_ota_result
      description: "pomona/unit/ota_result -> sys/ota/result"
      sql: SELECT * FROM "pomona/unit/ota_result"
      topic: demeter/pomona-0001/sys/ota/result
      qos: "1"
      retain: "true"
      payload: "${payload}"
    # ---- v2 -> v1: the requests a v2 publisher makes of a v1 node ----------------
    - id: v2_pomona_pump_set
      description: "actuator/pump/set (Demeter / HA) -> pomona/pump/override (never retained)"
      sql: SELECT * FROM "demeter/pomona-0001/actuator/pump/set"
      topic: pomona/pump/override
      qos: "1"
      retain: "false"
      payload: "${payload}"
    - id: v2_pomona_ota_url
      description: "sys/ota/url -> pomona/unit/ota_url (never retained: a retained URL re-flashes on every reconnect)"
      sql: SELECT * FROM "demeter/pomona-0001/sys/ota/url"
      topic: pomona/unit/ota_url
      qos: "1"
      retain: "false"
      payload: "${payload}"
    - id: v2_pomona_diag_get
      description: "sys/diag/i2c_scan/get -> pomona/unit/i2c_scan/get"
      sql: SELECT * FROM "demeter/pomona-0001/sys/diag/i2c_scan/get"
      topic: pomona/unit/i2c_scan/get
      qos: "0"
      retain: "false"
      payload: "${payload}"
    - id: v2_pomona_stage
      description: "desired.stage (the registry) -> pomona/control/mode (establishment|established, retained)"
      sql: SELECT payload.stage as stage FROM "demeter/pomona-0001/desired" WHERE payload.stage <> ''
      topic: pomona/control/mode
      qos: "1"
      retain: "true"
      payload: "${stage}"
