# Lab-CA TLS cert for the gateway's per-hostname HTTPS listener (grafana-https
# in .config/lab/gateway.yaml) so https://grafana.lab.local terminates at the
# gateway — same pattern as argocd/hermes/influxdb/jaeger. Secret lives in ns
# observability; the gateway-config chart emits the ReferenceGrant automatically.
tlsCertificate:
  enabled: true
  secretName: grafana-server-tls
  commonName: grafana.lab.local
  dnsNames:
    - grafana.lab.local
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: lab-ca-issuer
    kind: ClusterIssuer

# Jupiter long-term ledger (card #308): the Grafana datasource "Jupiter ledger
# (PostgreSQL)" on jupiter-pg reads its password from env JUPITER_PG_PASSWORD
# (secret grafana-jupiter-postgres, ns observability). The blob is sealed per
# environment in .config/<env>/observability.yaml under this same key — the
# SealedSecret renders only when it is non-empty (Grafana's envFromSecrets entry
# is optional, so nothing blocks without it).
jupiterPostgres:
  sealedSecret:
    encryptedData: {} # { JUPITER_PG_PASSWORD: "Ag..." }
