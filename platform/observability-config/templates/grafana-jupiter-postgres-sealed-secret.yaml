{{- if .Values.jupiterPostgres.sealedSecret.encryptedData }}
# JUPITER_PG_PASSWORD for the Grafana datasource "Jupiter ledger (PostgreSQL)"
# (card #308) — the SAME password as the `grafana` role's secret
# `jupiter-pg-grafana` in ns jupiter-central, sealed a second time for THIS
# namespace + name (sealed blobs are namespace + name scoped). Rendered only
# once .config/<env>/observability-config.yaml carries the blob; Grafana's
# envFromSecrets entry is optional, so Grafana boots without it and only this
# datasource fails to connect until the owner seals it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-jupiter-postgres
  namespace: observability
spec:
  encryptedData:
    {{- range $k, $v := .Values.jupiterPostgres.sealedSecret.encryptedData }}
    {{- if $v }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
  template:
    metadata:
      name: grafana-jupiter-postgres
      namespace: observability
{{- end }}
