# Harbor prerequisites (platform/harbor-config) — lab values.
#
# Sealed for namespace harbor with the sealed-secrets controller in argocd. The
# values were generated once (random, lengths per platform/harbor-config/values.yaml)
# and never left the cluster in plaintext. Read one back with e.g.
#   kubectl -n harbor get secret harbor-secrets -o jsonpath='{.data.HARBOR_ADMIN_PASSWORD}' | base64 -d
# Re-sealing harbor-core-token (or secretKey) invalidates existing tokens /
# encrypted settings; see the README before rotating anything.
secrets:
  encryptedData:
    CSRF_KEY: 
    REGISTRY_HTTP_SECRET: 
    JOBSERVICE_SECRET: 
    REGISTRY_PASSWD: 
    HARBOR_ADMIN_PASSWORD: 
    secret: 
    secretKey: 
    REGISTRY_HTPASSWD: 
coreToken:
  encryptedData:
    tls.key: 
    tls.crt: 
