# Pomona ingestion bridge — lab overrides.
#
# OWNER PRE-DEPLOY (see landingzones/pomona/README.md "Owner runbook" for the
# full steps): create the EMQX `pomona-ingest` user + subscribe-only ACL on
# pomona/#, create the InfluxDB `pomona` bucket (365d retention) + a scoped
# write token, then seal all three values below. Until real blobs are pasted
# here the SealedSecret is not rendered and the pod idles (envFrom optional).
#
# Seal each value (namespace + name scoped — ns pomona / secret pomona-secrets):
#   printf '%s' "$VALUE" | kubeseal --raw \
#     --controller-name sealed-secrets --controller-namespace argocd \
#     --namespace pomona --name pomona-secrets
# Pre-deploy steps completed 2026-08-31: EMQX user `pomona-ingest` created
# (subscribe-only allow pomona/# / deny #), Influx bucket `pomona` (org zeus,
# 8760h) + bucket-scoped RW token minted, all three values sealed below.
secret:
  sealedSecret:
    enabled: true
    encryptedData:
      MQTT_USER: ""
      MQTT_PASS: ""
      INFLUX_TOKEN: ""
