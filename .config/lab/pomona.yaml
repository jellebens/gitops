# Pomona ingestion bridge + demeter autodosing controller — lab overrides.
#
# OWNER PRE-DEPLOY (see landingzones/pomona/README.md "Owner runbook" for the
# full steps): create the EMQX `pomona-ingest` user + subscribe-only ACL on
# pomona/#, create the InfluxDB `pomona` bucket (365d retention) + a scoped
# write token, then seal all three values below. Until real blobs are pasted
# here the SealedSecret is not rendered and the pod idles (envFrom optional).
#
# Seal each value (namespace + name scoped — ns pomona / secret pomona-secrets):
#   printf '%s' "$VALUE" | kubeseal --raw \
#     --controller-name sealed-secrets --controller-namespace argocd \
#     --namespace pomona --name pomona-secrets
# Pre-deploy steps completed 2026-08-31: EMQX user `pomona-ingest` created
# (subscribe-only allow pomona/# / deny #), Influx bucket `pomona` (org zeus,
# 8760h) + bucket-scoped RW token minted, all three values sealed below.
secret:
  sealedSecret:
    enabled: true
    encryptedData:
      MQTT_USER: ""
      MQTT_PASS: ""
      INFLUX_TOKEN: ""

# --- Demeter (autodosing controller, #278) ----------------------------------
# OWNER PRE-DEPLOY: create the EMQX `pomona-demeter` user (subscribe pomona/#;
# publish ONLY pomona/dose/test + pomona/demeter/#; deny #) per the README
# owner runbook, then seal MQTT_USER / MQTT_PASS below (ns pomona, secret
# pomona-demeter-secrets):
#   printf '%s' "$VALUE" | kubeseal --raw \
#     --controller-name sealed-secrets --controller-namespace argocd \
#     --namespace pomona --name pomona-demeter-secrets
# Until real blobs land here the SealedSecret is not rendered and demeter
# idles unconnected (envFrom optional) — it cannot dose.
# Pre-deploy steps completed 2026-09-10: EMQX user `pomona-demeter` created
# (subscribe pomona/# / publish pomona/dose/test + pomona/demeter/# / deny #),
# live rules verified via GET, authn + subscribe + own-namespace publish
# smoke-tested against mqtt.lab.local, both values sealed below.
#
# mode stays the chart default (shadow). Flipping to active is a deliberate
# one-line override here — AFTER the shadow soak, and in the same release
# that retires the Tethys hourly task:
# demeter:
#   mode: active
demeter:
  secret:
    sealedSecret:
      enabled: true
      encryptedData:
        MQTT_USER: ""
        MQTT_PASS: ""
