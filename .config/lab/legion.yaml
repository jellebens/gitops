# Legion lab overrides (landingzones/legion).
#
# HTTPS through the shared gateway: the `legion-https` listener is declared in
# .config/lab/gateway.yaml and the certificate is emitted by the landing zone.

gateway:
  parentRef:
    name: cilium-gateway
    namespace: gateway
    sectionName: legion-https
  httpToHttpsRedirect:
    enabled: true
    sectionName: http

tlsCertificate:
  enabled: true
  issuerRef:
    name: lab-ca-issuer
    kind: ClusterIssuer

# robot$legion+pull of Harbor's project `legion`, as a dockerconfigjson. Sealed
# for namespace legion / secret legion-harbor-pull on 2026-11-23, with the same
# secret that .config/lab/harbor-config.yaml seals for the robot itself
# (legionPullRobot). Rotate the two together.
imagePullSecret:
  enabled: true
  sealedSecret:
    encryptedData:
      .dockerconfigjson: 

# Legate on, with its database: the view asks for a sign-in with GitHub, and
# shows Legion's documents and backlog as they stand on master, live.
#
# OWNER PRE-DEPLOY, before this is released (landingzones/legion/README.md,
# "Secrets"): register Legion's GitHub App and install it on
# amarok-consulting/legion, make an admin token, and seal the three secrets
# below. The chart refuses to render legate while any of them is empty.
legate:
  enabled: true
  secrets:
    # Sealed for namespace legion by .scripts/seal-legion-secrets.sh.
    adminToken:
      encryptedData:
        digest: ""
    githubApp:
      encryptedData:
        client-id: ""
        client-secret: ""
    githubAppKey:
      encryptedData:
        app-id: ""
        private-key: ""

postgres:
  enabled: true
  # Both volumes in the nightly Longhorn backup to the NAS, as ceres-pg's are.
  inheritedLabels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/nas-daily: enabled

# k3s-node03 cannot pull from Harbor: it has no /etc/hosts entry for
# harbor.lab.local, and containerd does not resolve a *.local name through DNS
# (homelab roles/k3s README). The control-plane node is kept off by the chart
# already, for the same reason. Take this out when the node can pull again.
avoidNodes:
  - k3s-node03.local
