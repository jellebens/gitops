# Values for the app-of-apps chart (applications/), lab only. Read by the
# bootstrap Application after .config/shared/values.yaml and .config/lab/values.yaml.

# ARC (#339). The controller (arc) and its StorageClass (arc-config) always
# deploy. The runner scale set (arc-runners) registers with GitHub, so its
# Application is only rendered once the GitHub App credential is sealed into
# .config/lab/arc-runners-config.yaml. Flip to true in the same PR as the seal.
# Procedure: landingzones/arc-runners/README.md "Enable the scale set".
arc:
  runners:
    enabled: true
  # A second scale set, for amarok-consulting/legion (runs-on: arc-legion),
  # in namespace arc-runners-legion. ON with the release that carries its
  # sealed GitHub App credential in
  # .config/lab/arc-runners-legion-config.yaml. Procedure:
  # landingzones/arc-runners/README.md "A second scale set: Legion".
  legionRunners:
    enabled: true

# Legion (landingzones/legion): the praetor's view of amarok-consulting/legion.
# ON since the `legion-https` listener (.config/lab/gateway.yaml) and the
# `legion` A record (.config/lab/coredns-lab.yaml) were added in the same PR.
# The image harbor.lab.local/legion/interface:<tag> must be in Harbor, or the
# pods wait in ImagePullBackOff until it is. Turning it off again:
# landingzones/legion/README.md "Rollback".
legion:
  enabled: true
