# InfluxDB 2.x (influxdata influxdb2 chart) — durable time-series store for
# zeus savings/forecast history, long-term sensor history, capacity tracking.
#
# DB files live on Longhorn (#235, 2026-08-14): 3 synchronous replicas on
# distinct wired nodes — survives a node/disk loss (the #175 failure class that
# node-pinned local-path could not). NOT the SMB share: databases need
# block/POSIX semantics (mmap, flock, fsync) that SMB doesn't provide.
# Longhorn is redundancy, not backup — the NAS backup CronJobs (influxdb-config)
# remain the disaster-recovery path.
#
# Admin password + token come from the influxdb-auth SealedSecret (see the
# influxdb-config app). InfluxDB will stay Pending until that secret exists.
adminUser:
  organization: zeus
  bucket: zeus
  user: admin
  retention_policy: "0s" # infinite at the bucket level; tune retention later
  # Secret with keys: admin-password, admin-token
  existingSecret: influxdb-auth

persistence:
  enabled: true
  # Flipped local-path -> longhorn during the #235 migration window (2026-08-14)
  # per platform/influxdb-config/RUNBOOK-longhorn-migration.md (#182): old PV
  # Retain'd, old PVC deleted while the STS was scaled to 0, this merge made
  # Argo provision a fresh Longhorn PVC, then `influx restore` from the NAS
  # full backup repopulated it. Do NOT flip this back to local-path in place —
  # storageClassName on a bound PVC is immutable; any change here needs the
  # runbook's scale-down/PVC-recreate dance around it.
  storageClass: longhorn
  accessMode: ReadWriteOnce
  size: 10Gi

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
