# Docker config for robot$legion+push on harbor.lab.local (push + pull on the
# Harbor project `legion`): what the build of a release pushes with. A copy of
# harbor/harbor-legion-push-robot (key `secret`), sealed 2026-11-25 straight
# from the cluster secret (never printed). If the robot secret rotates, re-seal
# this (README "A second scale set: Legion").
harborPush:
  name: harbor-legion-push
  encryptedData:
    .dockerconfigjson: ""

hookTemplate:
  name: arc-legion-hook-template
  template:
    spec:
      # Lists replace: the whole `volumes` list again. The volume keeps the
      # name the job container's mount refers to (chart values.yaml); only the
      # secret behind it is Legion's.
      volumes:
        - name: harbor-ci-push
          secret:
            secretName: harbor-legion-push
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: lab-root-ca
          configMap:
            name: lab-root-ca

# GitHub App credential of the App installed on amarok-consulting/legion.
# Not sealed yet. Seal with
#   ARC_NAMESPACE=arc-runners-legion \
#   ARC_CONFIG_FILE=.config/lab/arc-runners-legion-config.yaml \
#     .scripts/seal-arc-github-app.sh <app>.private-key.pem
# which appends the block below this line. Keep this the last block.
githubApp:
  encryptedData: {}
