gateway:
  name: cilium-gateway
  namespace: gateway
  className: cilium
  listenerName: http
  listenerPort: 80
  https:
    enabled: true
    listenerName: https
    listenerPort: 443
    hostname: argocd.lab.local
    tls:
      mode: Terminate
      certificateRefs:
        - group: ""
          kind: Secret
          name: argocd-server-tls
          namespace: argocd
  additionalHttpsListeners:
    - name: hermes-https
      port: 443
      hostname: hermes.lab.local
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: hermes-server-tls
            namespace: hermes
    - name: influxdb-https
      port: 443
      hostname: influxdb.lab.local
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: influxdb-server-tls
            namespace: influxdb
    - name: jaeger-https
      port: 443
      hostname: jaeger.lab.local
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: jaeger-server-tls
            namespace: jaeger
    - name: grafana-https
      port: 443
      hostname: grafana.lab.local
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: grafana-server-tls
            namespace: observability
    - name: longhorn-https
      port: 443
      hostname: longhorn.lab.local
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: longhorn-server-tls
            namespace: longhorn-system
    # ceres ADR-0015: the operator console. The certificate is emitted by the
    # ceres landing zone (janus-certificate.yaml, lab-ca-issuer); this chart
    # emits the cross-namespace ReferenceGrant for it. Reads are open on the
    # LAN, writes carry a bearer token — the same posture as Annona's API, and
    # weaker than it should be for a UI that can ask for a dose. The owner
    # accepted that as an interim because the lab has no SSO; the durable fix is
    # card #232, and it is recorded as a cost in ceres ADR-0015.
    - name: ceres-janus-https
      port: 443
      hostname: janus.lab.local
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: ceres-janus-server-tls
            namespace: ceres
  annotations:
    lbipam.cilium.io/ips: "192.168.50.200"

routes:
  - name: argocd
    namespace: argocd
    listeners:
      - http
      - https
    hostnames:
      - argocd.lab.local
    backend:
      name: argocd-server
      port: 80

  # chaos-mesh route removed (#189): the chaos dashboard is an active,
  # destructive capability (pod-kill / network / IO fault) and must not be
  # LAN-reachable. It is now ClusterIP + port-forward-only, securityMode on,
  # and namespace-policed by an ingress-only CNP (platform/chaos-mesh-config).
  # The chaos-mesh.lab.local A record is left in place (harmless: resolves to
  # the gateway VIP but has no route -> 404).

  - name: grafana
    namespace: observability
    # http kept alongside https: the kiosk and existing bookmarks use plain
    # http:// URLs (same both-listeners pattern as argocd/jaeger).
    listeners:
      - http
      - grafana-https
    hostnames:
      - grafana.lab.local
    backend:
      name: kube-prometheus-stack-grafana
      port: 80

  - name: influxdb
    namespace: influxdb
    listeners:
      - influxdb-https
    hostnames:
      - influxdb.lab.local
    backend:
      name: influxdb-influxdb2
      port: 80

  - name: jaeger
    namespace: jaeger
    listeners:
      - http
      - jaeger-https
    hostnames:
      - jaeger.lab.local
    backend:
      name: jaeger-query
      port: 16686

  # Ceres firmware images (ceres card #304 / #315): the OPERATOR's door to the share —
  # `POST http://firmware.lab.local/firmware/<type>/<version>` (raw .ota body,
  # `Authorization: Bearer $ANNONA_TOKEN`), `GET …/firmware` (the listing) and
  # `GET …/firmware/<type>/<version>` (the image; annona 0.9.0 serves it itself).
  # The `/firmware` prefix is the only path that reaches Annona on this host. PLAIN HTTP:
  # the token crosses the LAN in clear, which the owner accepted for the lab; writes are
  # token-gated, reads are open by design.
  # The NODES do not fetch through here: the GIGA resolves no lab.local name (OTA -3003)
  # and its OTA client speaks HTTP/1.0, which Envoy answers with 426 Upgrade Required —
  # every OTA of 2.3.1 through this gateway on 2026-09-17 delivered a 16-byte error page.
  # They fetch from the Annona service's own LB address (landingzones/ceres annona.lan,
  # http://192.168.50.202/firmware/<type>/<version>). The ceres-firmware nginx and its two
  # routes (hostname + by-IP /pomona) are gone with landingzones/ceres 0.15.0.
  - name: ceres-annona-firmware
    namespace: ceres
    listeners:
      - http
    hostnames:
      - firmware.lab.local
    path: /firmware
    backend:
      name: ceres-annona
      port: 8080

  # Longhorn admin UI — HTTPS-ONLY route, INTERIM (#233, owner decision
  # 2026-08-14). This partially rolls back #193 (security review 2026-07-12),
  # which removed the route entirely because the UI is UNAUTHENTICATED admin
  # (can delete volumes/replicas) and TLS alone is encryption, not auth. The
  # owner accepted that risk as an interim because no SSO exists in the lab
  # yet; the durable fix is the SSO rollout (card #232), after which this
  # route moves behind real authentication. Until then:
  #   - CONTENT is served only via the longhorn-https SNI listener; the plain
  #     `http` hostname is claimed by a redirect-only route (httpRedirects
  #     below) that 302s to https — never attach `http` to THIS route;
  #   - cert: longhorn-server-tls from lab-ca-issuer
  #     (platform/longhorn/templates/certificate.yaml);
  #   - the longhorn-system CNP re-admits the gateway `ingress` identity
  #     (platform/longhorn/templates/ciliumnetworkpolicy.yaml);
  #   - `kubectl -n longhorn-system port-forward svc/longhorn-frontend 8080:80`
  #     remains the RBAC-gated alternative.
  - name: longhorn
    namespace: longhorn-system
    listeners:
      - longhorn-https
    hostnames:
      - longhorn.lab.local
    backend:
      name: longhorn-frontend
      port: 80

# HTTP -> HTTPS 302 redirects (redirect-only routes on the shared `http`
# listener; the RequestRedirect is answered by the gateway Envoy itself, no
# backend involved — same pattern as hermes' hermes-http-to-https).
httpRedirects:
  - name: longhorn
    namespace: longhorn-system
    hostnames:
      - longhorn.lab.local
