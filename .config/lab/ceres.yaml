# ceres landing zone — lab overrides (one Vertumnus per unit, cards #291/#295).
#
# HISTORY: Ceres landed in shadow next to the previous controller (the Demeter brain,
# retired at the cutover of 2026-09-13 18:32Z, its namespace and chart deleted in the
# same commit as `mode: active` below — two controllers must never dose one tank,
# architecture §4). Until firmware 2.3.0 (#295 item 7) the tower spoke the v1 tree through
# the EMQX republish bridge (platform/mqtt) and the Vertumnus dosed through
# `mqtt.legacyBaseTopic: pomona`; item 8 (chart 0.12.0) removed the legacy root — the
# Vertumnus sends ml-based dose/request and judges the node's acks (ADR-0008).
#
# BROKER CREDS: every encryptedData below is sealed by landingzones/ceres/scripts/
# onboard-secrets.sh (ns ceres):
#   printf '%s' "$VALUE" | kubeseal --raw \
#     --controller-name sealed-secrets --controller-namespace argocd \
#     --namespace ceres --name <secret-name>

mode: active          # since the cutover (#295 item 4b, 2026-09-13): the Vertumnus owns the tank

units:
  pomona-0001:
    contract: v2          # ADR-0008 native since firmware 2.3.0 (#295 item 8): no legacy root
    configSource: mqtt    # #295 item 5b (2026-09-13): Annona projected the tower document (config v1);
                          # the config: block below stays as the import source of record only
    secret:
      sealedSecret:
        encryptedData:
          MQTT_USER: ""
          MQTT_PASS: ""
          VERTUMNUS_TOKEN: ""
    # DAILY CAPS REMOVED (owner 2026-09-11), carried over from the retired
    # pod's lab overrides in .config/lab/pomona.yaml. NOTE: 0, not null — a
    # null in a Helm values override DELETES the key and the chart default wins.
    rails:
      ph_daily_cap_ml: 0
      nutrient_feeds_per_24h: 0
      # Owner 2026-09-13: the 2 ml single-dose cap is lifted; owner 2026-09-16 (#315):
      # the node bounds ONE request and nothing per day — firmware 2.3.1
      # DOSE_MAX_ML_PER_CMD pH-Down = 4.0 ml (a regular dose is ~2 ml), and this rail
      # must not exceed it or the node refuses the request outright (2.3.0's 2 ml cap
      # refused every dose for a day: pH 8.5). The controller sends one command per
      # dose. The guard (97.5 % predictive drop above the tolerance floor) still sizes
      # the dose below this rail.
      ph_max_single_dose_ml: 4.0
    # THE LAB FACTS (carried over from .config/lab/pomona.yaml): the stage
    # ramp date and the bottle fills as of the 2026-09-11 baseline. This file
    # is now the source of truth for the tower's facts until the registry
    # (migration slice 2) takes over.
    config:
      established_from: "2026-09-14"
      reagents:
        ph_down:    { container_ml: 200,  filled_on: "2026-09-11", line_volume_ml: 0 }
        nutrient_a: { container_ml: 950,  filled_on: "2026-09-11", line_volume_ml: 0 }
        nutrient_b: { container_ml: 950,  filled_on: "2026-09-11", line_volume_ml: 0 }

# --- registry (slice 2, #292) -----------------------------------------------
# OWNER PRE-DEPLOY: create the `annona` EMQX user + ACL, then seal
# MQTT_USER / MQTT_PASS / ANNONA_TOKEN (ns ceres / secret
# ceres-annona-secrets). Until sealed the registry serves reads only and
# projects nothing; the Vertumnus keeps reading its file (configSource: file).
# After the one-off import (landing-zone README), set
# units.pomona-0001.configSource: mqtt here and drop the `config:` block above.
annona:
  secret:
    sealedSecret:
      encryptedData:
        MQTT_USER: ""
        MQTT_PASS: ""
        ANNONA_TOKEN: ""

# --- robigus (slice 4a, #293) -------------------------------------------------
# OWNER PRE-DEPLOY: create the `robigus` EMQX user + ACL (platform/mqtt/files/
# acl.conf is the DR mirror), then seal MQTT_USER / MQTT_PASS (ns ceres /
# secret ceres-robigus-secrets). Until sealed it cannot connect and publishes
# nothing; the PrometheusRule's plant-health mirror stays quiet.
robigus:
  secret:
    sealedSecret:
      encryptedData:
        MQTT_USER: ""
        MQTT_PASS: ""

# --- telegraf archive (slice 3, #295) --------------------------------------------
# OWNER PRE-DEPLOY: EMQX user `telegraf-ceres` (subscribe ceres/#), Influx
# bucket `ceres` + write token, then seal MQTT_USER / MQTT_PASS / INFLUX_TOKEN
# (ns ceres / secret ceres-telegraf-secrets). Until sealed nothing flows.
telegraf:
  secret:
    sealedSecret:
      encryptedData:
        MQTT_USER: ""
        MQTT_PASS: ""
        INFLUX_TOKEN: ""

# --- carmenta (slice 5, #298) -----------------------------------------------------
# OWNER PRE-DEPLOY: EMQX user `carmenta` (subscribe ceres/#; publish
# ceres/+/sys/prior, ceres/sys/advice, ceres/sys/status/carmenta), then seal
# MQTT_USER / MQTT_PASS (ns ceres / secret ceres-carmenta-secrets).
carmenta:
  secret:
    sealedSecret:
      encryptedData:
        MQTT_USER: ""
        MQTT_PASS: ""

# --- the grafana read-only role on ceres-pg (#298) -----------------------------------
# OWNER: pick a password, seal it as key `password` for ns ceres / secret
# ceres-pg-grafana (a plain SealedSecret; add it to this file as an extra
# manifest or seal by hand), and as CERES_PG_PASSWORD for ns observability /
# secret grafana-ceres-postgres (.config/lab/observability.yaml).

# --- janus: the operator console (ceres ADR-0015) ------------------------------------
# OWNER PRE-DEPLOY — all three steps done on 2026-09-17, before the first
# release of this block. Kept as the record of WHAT was done and HOW, because a
# zone rebuild or a second unit repeats it:
#   1. DONE 2026-09-17 — EMQX user `janus` created live with a generated
#      password that never reached a terminal or a file
#      (~/ceres-probe/janus-mqtt.sh). Its ACL is `subscribe ceres/#`, publish
#      ONLY ceres/sys/status/janus, then deny # — read back and matching the
#      mirror in platform/mqtt/files/acl.conf. That ACL is what makes "the
#      console cannot act on the tree" a broker fact rather than a promise in
#      the code. onboard-secrets.sh carries the same line for a zone rebuild.
#   2. DONE 2026-09-17 — MQTT_USER / MQTT_PASS sealed in the same run, and a
#      fresh random JANUS_TOKEN sealed by ~/ceres-probe/janus-tokens.sh. The
#      console needs that token for every write; the OWNER types it into the
#      page, so it is kept in .secrets/ceres/janus.token (0600, gitignored) —
#      the same place onboard-secrets.sh leaves the node's MQTT password.
#   3. DONE 2026-09-17 — the tower's EXISTING VERTUMNUS_TOKEN was read from
#      ceres-vertumnus-pomona-0001-secrets and resealed for this one as
#      VERTUMNUS_TOKEN_POMONA_0001. All four blobs were then checked with
#      `kubeseal --validate` against the live controller (~/ceres-probe/
#      janus-validate.sh), which is what catches the scoping trap below.
#      For a SECOND unit, repeat exactly this — seal each unit's EXISTING VERTUMNUS_TOKEN again for THIS secret, as
#      VERTUMNUS_TOKEN_<UNIT> (pomona-0001 -> VERTUMNUS_TOKEN_POMONA_0001). A
#      sealed blob is namespace+name scoped, so the blob in the unit's own
#      secret cannot be copied here — reseal the same plaintext:
#        kubectl get secret -n ceres ceres-vertumnus-pomona-0001-secrets \
#          -o go-template='{{index .data "VERTUMNUS_TOKEN" | base64decode}}' \
#        | kubeseal --raw --controller-name sealed-secrets --controller-namespace argocd \
#            --namespace ceres --name ceres-janus-secrets --from-file=/dev/stdin
#   4. DONE 2026-09-18 (janus 0.2.0) — the operator account a browser signs in
#      with: JANUS_USERNAME `jelle`, JANUS_PASSWORD_HASH (PBKDF2, made by janus's
#      own `python -m ceres_janus.auth hash`, so the format cannot drift) and
#      JANUS_SESSION_KEY, sealed by ~/ceres-probe/janus-account.sh and checked
#      with `kubeseal --validate`. The PASSWORD is in .secrets/ceres/janus.password
#      (0600, gitignored) and nowhere else — the cluster holds only its hash. To
#      change it: `python -m ceres_janus.auth hash`, reseal JANUS_PASSWORD_HASH.
# The degraded modes, for whoever hits them later: with no MQTT creds the
# console serves an empty page; with no JANUS_TOKEN it reads but refuses every
# write with 403; with no VERTUMNUS_TOKEN_<UNIT> it reads that unit but cannot
# dose it. In each case the page names what is missing rather than failing quietly.
#
# Exposure: https://janus.lab.local through the shared gateway — the
# ceres-janus-https listener in .config/lab/gateway.yaml, the A record in
# .config/lab/coredns-lab.yaml (serial bumped), and the lab-CA certificate from
# the landing zone. Reads are open on the LAN, writes need JANUS_TOKEN; there is
# no SSO in the lab (card #232) and ceres ADR-0015 records that as a cost.
janus:
  gateway:
    parentRef:
      name: cilium-gateway
      namespace: gateway
      sectionName: ceres-janus-https
    httpToHttpsRedirect:
      enabled: true
      sectionName: http
  tlsCertificate:
    enabled: true
    issuerRef:
      name: lab-ca-issuer
      kind: ClusterIssuer
  secret:
    sealedSecret:
      encryptedData:
        MQTT_USER: ""
        MQTT_PASS: ""
        JANUS_USERNAME: ""
        JANUS_PASSWORD_HASH: ""
        JANUS_SESSION_KEY: ""
        JANUS_TOKEN: ""
        VERTUMNUS_TOKEN_POMONA_0001: ""
