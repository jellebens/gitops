repos:
  chaosMesh: 
   url: https://charts.chaos-mesh.org
   targetRevision: 2.8.6

  prometheus: 
    url: https://prometheus-community.github.io/helm-charts
    targetRevision: 82.18.0

  certManager:
    url: https://charts.jetstack.io
    targetRevision: v1.21.2

  csiDriverSmb:
    url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
    targetRevision: 1.20.3

  influxdb:
    url: https://helm.influxdata.com
    targetRevision: 2.1.2
  # CloudNativePG operator (demeter ADR-0011, card #292): chart 0.29.1 = operator 1.30.1 (#350; 0.29.0 = 1.30.0 at install).
  cnpg:
    url: https://cloudnative-pg.github.io/charts
    targetRevision: 0.29.1

  longhorn:
    url: https://charts.longhorn.io
    targetRevision: 1.11.3

  kyverno:
    url: https://kyverno.github.io/kyverno
    targetRevision: 3.9.2

  # Harbor registry. Chart 1.19.2 = Harbor v2.15.2, but the images are pinned
  # nightly dev-arm64 digests (no arm64 release images) — see .config/lab/harbor.yaml.
  harbor:
    url: https://helm.goharbor.io
    targetRevision: 1.19.2

  # Our own Harbor as an OCI Helm registry (Argo repo-creds ).
  # No scheme: Argo OCI repo URLs are host/path.
  harborRegistry:
    url: harbor.lab.local

  # ARC (actions-runner-controller) charts, mirrored into Harbor by #338
  # (.scripts/arc-mirror/artifacts.lock). Both charts (controller + scale set)
  # live under this path and share the ARC version. Bump together with the lock.
  arc:
    url: harbor.lab.local/actions/actions-runner-controller-charts
    targetRevision: 0.15.0

  config:
    url: https://github.com/jellebens/gitops.git
    targetRevision: HEAD
